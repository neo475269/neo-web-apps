<body>

function showErr(m){const e=document.getElementById('err');e.style.display='block';e.innerHTML='<b>The 3D scene could not start.</b><br>'+m+'<br><br>Check your internet connection (Three.js loads from unpkg.com) and open the file in Chrome, Edge or Firefox.';}
addEventListener('error',e=>showErr(e.message||'Script failed to load'));
addEventListener('unhandledrejection',e=>showErr(String(e.reason)));

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   GEOGRAPHY (1 unit ≈ 10 m, true north-up)
   +x = east, +z = south.  Origin ≈ 22.290°N, 114.170°E (mid-harbour off Wan Chai/TST).
   The coastlines are polylines traced from the real harbour:
   - Hong Kong Island: Kennedy Town → Sheung Wan (Shun Tak) → Central piers →
     Central harbourfront → Tamar → Wan Chai → HKCEC peninsula → Causeway Bay →
     North Point → Quarry Bay (shore bends north-east).
   - Kowloon: West Kowloon reclamation → WKCD → Ocean Terminal finger pier →
     TST (Star Ferry, Clock Tower) → Avenue of Stars → Hung Hom → To Kwa Wan →
     former Kai Tak runway jutting south-east into Kowloon Bay.
   The harbour is ~1 km wide between Central and TST and widens to the east.
   ========================================================= */
const LM = {
  center:{x:-160,z:48}, ifc:{x:-118,z:48}, wheel:{x:-74,z:44}, boc:{x:-88,z:88},
  cplaza:{x:37,z:98},  hkcec:{x:36,z:58},  bauhinia:{x:42,z:47.5},
  icc:{x:-101,z:-150},  clock:{x:-6,z:-47}, culture:{x:6,z:-52}, space:{x:20,z:-56},
  k11:{x:46,z:-64}
};

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(852);
const ss = (a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- coastlines ---------- */
const ISL_COAST=[[-2000,60],[-700,48],[-460,34],[-330,18],[-250,14],[-200,14],
  [-198,2],[-172,2],[-168,14],                    // Shun Tak / Macau Ferry pier
  [-140,22],[-118,24],[-114,14],[-86,14],[-84,26],// Central ferry piers
  [-80,34],[-60,45],[-40,60],[-15,66],[10,70],[18,70],
  [22,60],[26,48],[46,44],[50,54],[54,72],        // HKCEC peninsula (Wan Chai)
  [62,75],[100,80],[140,84],[175,74],             // Wan Chai → Causeway Bay
  [210,45],[260,10],[310,-15],[380,-35],[500,-50],[700,-60],[2000,-60]]; // North Point → Quarry Bay
const KLN_COAST=[[-2000,-210],[-700,-175],[-420,-170],[-300,-150],[-220,-120],
  [-190,-95],[-150,-88],[-90,-88],[-60,-92],[-48,-95],      // West Kowloon / WKCD
  [-46,-34],[-32,-34],[-32,-46],                            // Ocean Terminal
  [-20,-44],[0,-40],[20,-46],[45,-52],[90,-70],[140,-100],  // TST → Avenue of Stars
  [185,-132],[230,-180],[280,-235],[300,-270],              // Hung Hom → To Kwa Wan
  [440,-140],[465,-120],[478,-132],[322,-292],              // Kai Tak runway
  [340,-320],[520,-310],[700,-330],[2000,-330]];
const ISLAND=[...ISL_COAST,[2000,2000],[-2000,2000]];
const KOWLOON=[...KLN_COAST,[2000,-2000],[-2000,-2000]];

function sdPoly(poly,x,z){ // signed distance: + inside (land), - outside (water)
  let inside=false,md=1e18;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],zi=poly[i][1],xj=poly[j][0],zj=poly[j][1];
    if(((zi>z)!==(zj>z)) && (x<(xj-xi)*(z-zi)/(zj-zi)+xi)) inside=!inside;
    const dx=xj-xi,dz=zj-zi; let t=((x-xi)*dx+(z-zi)*dz)/(dx*dx+dz*dz); t=t<0?0:t>1?1:t;
    const ex=xi+t*dx-x,ez=zi+t*dz-z,d=ex*ex+ez*ez; if(d<md)md=d;
  }
  md=Math.sqrt(md); return inside?md:-md;
}
function islandHill(x,z,d){
  const ridge=28+10*Math.sin(x*0.018+0.7)+6*Math.sin(x*0.051+2.1)+3*Math.sin(x*0.13+z*0.05);
  const peak=24*Math.exp(-(((x+250)/80)**2+((z-175)/70)**2))*ss(60,140,d);   // Victoria Peak
  return ss(25,110,d)*ridge+peak;
}
function kowloonHill(x,z,d){
  return ss(140,300,d)*(30+14*Math.sin(x*0.017)+7*Math.sin(x*0.049+1)+3*Math.sin(x*0.11-z*0.04));
}
function landInfo(x,z){
  const di=sdPoly(ISLAND,x,z); if(di>0) return {land:true,isl:true,d:di,h:1+islandHill(x,z,di)};
  const dk=sdPoly(KOWLOON,x,z); if(dk>0) return {land:true,isl:false,d:dk,h:1+kowloonHill(x,z,dk)};
  return {land:false,isl:false,d:Math.max(di,dk),h:-4};
}
const groundH=(x,z)=>landInfo(x,z).h;

// mid-channel line used for boat routes and the harbour cruise
const MID=[[-600,-80],[-400,-70],[-250,-50],[-150,-35],[-60,-5],[0,12],[60,5],[120,-15],[200,-50],[300,-80],[420,-90],[600,-110]];
function midZ(x){
  if(x<=MID[0][0]) return MID[0][1];
  for(let i=1;i<MID.length;i++) if(x<=MID[i][0]){const a=MID[i-1],b=MID[i];return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]));}
  return MID[MID.length-1][1];
}

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0012);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 5; controls.maxDistance = 1200;

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x203040, 0.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2); scene.add(sun); scene.add(sun.target);

/* ---------- facade materials ---------- */
function makeFacade(wall, glass, seed, litRatio){
  const r=mulberry32(seed), S=512, N=32, c=S/N;
  const a=document.createElement('canvas'); a.width=a.height=S; const g=a.getContext('2d');
  const b=document.createElement('canvas'); b.width=b.height=S; const e=b.getContext('2d');
  g.fillStyle=wall; g.fillRect(0,0,S,S); e.fillStyle='#000'; e.fillRect(0,0,S,S);
  const warm=['#ffd9a0','#ffe8c0','#fff4e0','#cfe6ff','#ffc070','#e0f0ff'];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const x=i*c+3,y=j*c+3,w=c-6,h=c-6;
    g.fillStyle=glass; g.fillRect(x,y,w,h);
    if(r()<litRatio){e.globalAlpha=0.45+r()*0.55; e.fillStyle=warm[(r()*warm.length)|0]; e.fillRect(x,y,w,h); e.globalAlpha=1;}
  }
  const mk=cv=>{const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};
  return new THREE.MeshStandardMaterial({map:mk(a),emissiveMap:mk(b),emissive:0xffffff,emissiveIntensity:1,roughness:0.55,metalness:0.25});
}
const facades = [
  makeFacade('#8f949c','#3c4a5c',11,0.55),
  makeFacade('#b8ad9c','#4a4a48',22,0.6),
  makeFacade('#5c6a7a','#22384f',33,0.5),
  makeFacade('#d0d4d8','#5a7590',44,0.5),
];
const glassMat = makeFacade('#4d6a86','#1e3550',55,0.45);
glassMat.metalness=0.6; glassMat.roughness=0.25;
const facadeMats=[...facades, glassMat];

function boxUV(g,w,h,d){
  const uv=g.attributes.uv;
  for(let f=0;f<6;f++)for(let k=0;k<4;k++){
    const i=f*4+k; let u=uv.getX(i), v=uv.getY(i);
    if(f===2||f===3){u=0.001;v=0.001;} else {u*=((f<2)?d:w)/32; v*=h/32;}
    uv.setXY(i,u,v);
  }
  uv.needsUpdate=true; return g;
}
function texMat(base, ru, rv){
  const m=base.clone(); m.map=base.map.clone(); m.emissiveMap=base.emissiveMap.clone();
  m.map.repeat.set(ru,rv); m.emissiveMap.repeat.set(ru,rv); m.map.needsUpdate=m.emissiveMap.needsUpdate=true;
  facadeMats.push(m); return m;
}

/* ---------- city (merged generic buildings) ---------- */
const buckets = facades.map(()=>[]);
const roofs = [];
const exclusion = [
  [LM.center,9],[LM.ifc,14],[LM.boc,9],[LM.cplaza,10],[LM.icc,12],[LM.k11,7],
  [{x:-74,z:44},12],[{x:6,z:-50},22],[{x:37,z:62},22],[{x:70,z:78},6],
  [{x:-39,z:-48},14],[{x:-39,z:-75},10]
];
const excluded=(x,z)=>exclusion.some(([p,r])=>Math.hypot(x-p.x,z-p.z)<r);

function addGeneric(x,z,w,d,h,L){
  const g=boxUV(new THREE.BoxGeometry(w,h,d),w,h,d);
  const base=L.h;
  g.translate(x,base+h/2,z);
  buckets[(rnd()*buckets.length)|0].push(g);
  roofs.push({x,z,y:base+h,w,d,h,isl:L.isl,sd:L.d});
}
// Hong Kong Island: Kennedy Town → Sheung Wan → Central → Admiralty → Wan Chai → Causeway Bay → North Point
for(let x=-330;x<=380;x+=6.5){
  for(let z=-40;z<=200;z+=6.5){
    const jx=x+(rnd()-0.5)*2, jz=z+(rnd()-0.5)*2;
    const L=landInfo(jx,jz);
    if(!L.land||!L.isl||L.d<4||excluded(jx,jz)||L.h-1>14) continue;
    if(rnd()<0.12) continue;
    const cbd = 16*Math.exp(-(((jx+110)/60)**2)) + 12*Math.exp(-(((jx-40)/50)**2)) + 6*Math.exp(-(((jx-160)/45)**2)) + 4*Math.exp(-(((jx-270)/50)**2));
    const depth = 1 - ss(40,110,L.d)*0.5;
    const h = (7 + cbd + rnd()*10*(0.6+cbd/16)) * depth;
    addGeneric(jx,jz,3+rnd()*2.5,3+rnd()*2.5,Math.max(4,h),L);
  }
}
// Kowloon: West Kowloon → TST → Hung Hom → To Kwa Wan → Kai Tak
for(let x=-260;x<=500;x+=6.5){
  for(let z=-30;z>=-340;z-=6.5){
    const jx=x+(rnd()-0.5)*2, jz=z+(rnd()-0.5)*2;
    const L=landInfo(jx,jz);
    if(!L.land||L.isl||L.d<4||excluded(jx,jz)||L.h-1>10) continue;
    if(jx<-50 && jx>-200 && jz>-150 && rnd()<0.7) continue; // West Kowloon Cultural District park
    if(jx>300 && rnd()<0.5) continue;                       // Kai Tak runway
    if(rnd()<0.15) continue;
    const h = 5 + rnd()*9 + 8*Math.exp(-(((jx-20)/80)**2))*ss(-170,-70,jz);
    addGeneric(jx,jz,3+rnd()*2.5,3+rnd()*2.5,h,L);
  }
}
buckets.forEach((arr,i)=>{ if(arr.length) scene.add(new THREE.Mesh(mergeGeometries(arr,false),facades[i])); });

/* ---------- terrain (height-field cut by the real coastlines) ---------- */
function makeTerrain(x0,x1,z0,z1,step,hole){
  const w=x1-x0,d=z1-z0,cx=(x0+x1)/2,cz=(z0+z1)/2;
  const g=new THREE.PlaneGeometry(w,d,Math.round(w/step),Math.round(d/step)); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, col=[];
  const cUrb=new THREE.Color('#5c5f62'), cMid=new THREE.Color('#3f6b3a'), cHigh=new THREE.Color('#2c4f2a'), cSea=new THREE.Color('#1c2a30');
  for(let i=0;i<p.count;i++){
    const x=p.getX(i)+cx, z=p.getZ(i)+cz;
    if(hole && x>hole[0]&&x<hole[1]&&z>hole[2]&&z<hole[3]){p.setY(i,-12);col.push(cSea.r,cSea.g,cSea.b);continue;}
    const L=landInfo(x,z); p.setY(i,L.h);
    const h=L.h-1;
    const c=!L.land?cSea:(h<4?cUrb.clone().lerp(cMid,h/4):cMid.clone().lerp(cHigh,Math.min(1,(h-4)/30)));
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,flatShading:true}));
  m.position.set(cx,0,cz); scene.add(m);
}
makeTerrain(-600,600,-520,420,2.5);                               // detailed harbour area
makeTerrain(-2400,2400,-2400,2000,24,[-590,590,-510,410]);        // distant hills

// Residential lights on the hillsides (Mid-Levels, Kowloon hills)
const hillLights=(()=>{
  const pos=[];
  for(let i=0;i<9000 && pos.length<2600*3;i++){
    const x=-500+rnd()*1000, z=-480+rnd()*860;
    const L=landInfo(x,z); if(!L.land) continue;
    const h=L.h-1;
    if(L.isl ? (L.d<45||h<4||h>48) : (L.d<120||h<3||h>40)) continue;
    pos.push(x,L.h+0.8+rnd()*1.5,z);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xffd9a0,size:0.9,transparent:true,opacity:0}));
  scene.add(p); return p;
})();

/* ---------- landmarks ---------- */
const accentMats=[];   // materials animated at night / during the show
function basic(color,opacity=1){const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity});accentMats.push(m);return m;}
const whiteMat=new THREE.MeshStandardMaterial({color:0xf2f2ee,roughness:0.35,metalness:0.2,emissive:0x1a1f2a});
const concrete=new THREE.MeshStandardMaterial({color:0x8a8d90,roughness:0.9});
function add(mesh,x,y,z){mesh.position.set(x,y,z);scene.add(mesh);return mesh;}
function tower(x,z,w,h,d,mat,y0=0){const g=boxUV(new THREE.BoxGeometry(w,h,d),w,h,d);return add(new THREE.Mesh(g,mat),x,y0+h/2,z);}

// --- Two IFC + One IFC (Central waterfront)
tower(LM.ifc.x,LM.ifc.z,7,30,7,glassMat);
tower(LM.ifc.x,LM.ifc.z,6.2,6,6.2,glassMat,30);
tower(LM.ifc.x,LM.ifc.z,5.4,3,5.4,glassMat,36);
const ifcFin=basic(0xdfe8ff,0.9);
[[-2.4,-2.4],[2.4,-2.4],[-2.4,2.4],[2.4,2.4]].forEach(([dx,dz])=>add(new THREE.Mesh(new THREE.BoxGeometry(0.5,4.5,0.5),ifcFin),LM.ifc.x+dx,41,LM.ifc.z+dz));
tower(LM.ifc.x-10,LM.ifc.z+6,6,21,6,glassMat);
tower(LM.ifc.x-5,LM.ifc.z-6,14,3,6,concrete);

// --- The Center (rainbow neon bands)
tower(LM.center.x,LM.center.z,5,33,5,facades[2]);
const centerBands=[];
for(let i=0;i<20;i++){const m=basic(0xffffff,0);centerBands.push(m);add(new THREE.Mesh(new THREE.BoxGeometry(5.3,0.14,5.3),m),LM.center.x,3+i*1.55,LM.center.z);}
add(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,4,6),concrete),LM.center.x,35,LM.center.z);

// --- Bank of China Tower (4 triangular shafts + white X frame)
{
  const bocY=groundH(LM.boc.x,LM.boc.z)-0.4;   // BOC sits on the lower slope of Garden Road
  const s=2.7, tris=[[[0,0],[s,s],[s,-s]],[[0,0],[s,-s],[-s,-s]],[[0,0],[-s,-s],[-s,s]],[[0,0],[-s,s],[s,s]]];
  const hs=[18,24,29,31.5];
  const bocGlass=new THREE.MeshStandardMaterial({color:0x5d7a96,metalness:0.7,roughness:0.2,emissive:0x0a1420});
  const edgeMat=basic(0xffffff,0.85);
  tris.forEach((t,i)=>{
    const sh=new THREE.Shape(t.map(([a,b])=>new THREE.Vector2(a,b)));
    const g=new THREE.ExtrudeGeometry(sh,{depth:hs[i],bevelEnabled:false}); g.rotateX(-Math.PI/2);
    add(new THREE.Mesh(g,bocGlass),LM.boc.x,bocY,LM.boc.z);
    add(new THREE.LineSegments(new THREE.EdgesGeometry(g),edgeMat),LM.boc.x,bocY,LM.boc.z);
  });
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,6,6),concrete),LM.boc.x-0.8,bocY+34.5,LM.boc.z+0.8);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,6,6),concrete),LM.boc.x+0.8,bocY+34.5,LM.boc.z+0.8);
}

// --- Central Plaza (Wan Chai): triangular tower, pyramid top, light-clock crown

function coastSampler(coast,x0,x1){
  const segs=[];let tot=0;
  for(let i=0;i<coast.length-1;i++){const a=coast[i],b=coast[i+1];
    if(Math.min(a[0],b[0])<x0||Math.max(a[0],b[0])>x1) continue;
    const l=Math.hypot(b[0]-a[0],b[1]-a[1]);tot+=l;segs.push([a,b,tot]);}
  return ()=>{const r=rnd()*tot;const s=segs.find(q=>q[2]>=r)||segs[segs.length-1];const t=rnd();
    return [lerp(s[0][0],s[1][0],t),lerp(s[0][1],s[1][1],t)];};
}

  ['TSIM SHA TSUI 尖沙咀',20,32,-110,'d'],['WEST KOWLOON 西九龍',-130,40,-180,'d'],['HUNG HOM 紅磡',200,30,-170,'d'],['KAI TAK 啟德',400,20,-175,'d']];
const labelBox=document.getElementById('labels');
const labels=labelDefs.map(([t,x,y,z,c])=>{const d=document.createElement('div');d.className='lbl'+(c?' d':'');d.textContent=t;labelBox.appendChild(d);return {d,p:new THREE.Vector3(x,y,z)};});

/* ---------- time-of-day palette ---------- */
const K=[ // hour, skyTop, horizon, sunColor, sunInt, hemiInt
  [0,'#050a1c','#16204a','#8fa3d8',0.3,0.35],[5,'#071030','#1c2550','#8fa3d8',0.3,0.35],
  [6,'#1b2a55','#d98a5f','#ff9a5a',0.5,0.3],[7,'#3c6db0','#f0c49a','#ffd2a0',1.6,0.7],
  [10,'#3a7fd5','#a9d1f0','#fff4e0',2.6,1.0],[15,'#3a7fd5','#b5d8f2','#fff2dc',2.5,1.0],
  [17,'#4a78b8','#f0c896','#ffc890',1.8,0.8],[18,'#2a3a70','#ff8050','#ff7a40',0.8,0.5],
  [18.7,'#121a40','#6a3a5a','#ff6040',0.2,0.22],[19.5,'#081232','#202850','#8fa3d8',0.3,0.35],[24,'#050a1c','#16204a','#8fa3d8',0.3,0.35]
].map(r=>[r[0],new THREE.Color(r[1]),new THREE.Color(r[2]),new THREE.Color(r[3]),r[4],r[5]]);
function palette(h){
  let i=0;while(i<K.length-2&&h>=K[i+1][0])i++;
  const a=K[i],b=K[i+1],t=(h-a[0])/(b[0]-a[0]);
  return {top:a[1].clone().lerp(b[1],t),hor:a[2].clone().lerp(b[2],t),sunC:a[3].clone().lerp(b[3],t),sunI:lerp(a[4],b[4],t),hemiI:lerp(a[5],b[5],t)};
}

/* ---------- weather ---------- */
const WEATHER={
  clear:  {cloud:0.15,rain:0,   wind:0.3, fog:0.0011,wave:0.25,dark:0,   lightning:0},
  cloudy: {cloud:0.85,rain:0,   wind:0.5, fog:0.0018,wave:0.4, dark:0.35,lightning:0},
  rain:   {cloud:1,   rain:0.5, wind:0.6, fog:0.0032,wave:0.6, dark:0.55,lightning:0},
  typhoon:{cloud:1,   rain:1,   wind:2.4, fog:0.0048,wave:1.7, dark:0.7, lightning:1},
  fog:    {cloud:0.5, rain:0,   wind:0.15,fog:0.009, wave:0.15,dark:0.3, lightning:0},
};
const W={...WEATHER.clear};

/* ---------- state & UI ---------- */
const state={hour:20,play:false,weather:'clear',sym:'auto',cam:'tst',showLbl:true,flash:0};
const $=id=>document.getElementById(id);
const fmt=h=>{const m=Math.round(h*60)%1440;return String((m/60)|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
$('hour').oninput=e=>{state.hour=+e.target.value;};
$('play').onclick=()=>{state.play=!state.play;$('play').classList.toggle('on',state.play);$('play').textContent=state.play?'❚❚ Pause':'▶ Time-lapse';};
$('now').onclick=()=>{const d=new Date();state.hour=((d.getUTCHours()+8)%24)+d.getUTCMinutes()/60;};
document.querySelectorAll('#weather button').forEach(b=>b.onclick=()=>{state.weather=b.dataset.w;document.querySelectorAll('#weather button').forEach(x=>x.classList.toggle('on',x===b));});
$('sym').onchange=e=>state.sym=e.target.value;
$('showLbl').onchange=e=>{state.showLbl=e.target.checked;labelBox.style.display=state.showLbl?'':'none';};
const CAMS={
  tst:   {p:[30,3.5,-50],t:[-20,14,90]},                         // Avenue of Stars / TST promenade
  peak:  {p:[-245,groundH(-245,170)+8,170],t:[-30,0,-10]},       // Victoria Peak looking north
  aerial:{p:[420,180,-40],t:[-80,0,-10]},                        // looking west down the harbour
};
function setCam(c){state.cam=c;document.querySelectorAll('#cams button').forEach(x=>x.classList.toggle('on',x.dataset.c===c));
  if(c!=='cruise'){camera.position.set(...CAMS[c].p);controls.target.set(...CAMS[c].t);controls.enabled=true;}else controls.enabled=false;controls.update();}
document.querySelectorAll('#cams button').forEach(b=>b.onclick=()=>setCam(b.dataset.c));
setCam('tst');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- animation loop ---------- */
const clock=new THREE.Clock();
const sunDir=new THREE.Vector3(), moonDir=new THREE.Vector3(), tmp=new THREE.Vector3(), tmpC=new THREE.Color();
const cpColors=['#ff3030','#ffffff','#b030ff','#ffd020','#30ff60','#30a0ff'].map(c=>new THREE.Color(c));
let cruiseT=0, elapsed=0;

function boatPose(g,x,z,heading,t,bob){
  g.position.set(x,Math.sin(t*1.4+x*0.1)*0.12*bob,z);
  g.rotation.set(Math.sin(t*1.1+z)*0.04*bob,heading,Math.sin(t*1.7+x)*0.05*bob);
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1); elapsed+=dt; const t=elapsed;

  if(state.play){state.hour=(state.hour+dt/3)%24;}
  $('hour').value=state.hour; $('timeLbl').textContent=fmt(state.hour);
  const h=state.hour;

  // smooth weather transition
  const tgt=WEATHER[state.weather], k=1-Math.exp(-dt*1.2);
  for(const key in W) W[key]=lerp(W[key],tgt[key],k);

  // sun & moon (October, ~22°N: rises east, passes south, sets west)
  const a=(h-6.2)/11.8*Math.PI;
  sunDir.set(Math.cos(a),Math.sin(a)*0.88,Math.max(0,Math.sin(a))*0.45+0.05).normalize();
  const ma=(h-18.5)/12*Math.PI;
  moonDir.set(Math.cos(ma),Math.sin(ma)*0.8+0.05,0.4).normalize();
  const night=1-ss(-0.12,0.18,sunDir.y);

  // colours with weather
  const P=palette(h);
  const greyMix=W.cloud*0.65;
  const grey=c=>{const l=c.r*0.3+c.g*0.55+c.b*0.15;return c.lerp(tmpC.setRGB(l*0.92,l*0.96,l),greyMix).multiplyScalar(1-W.dark*0.45);};
  grey(P.top); grey(P.hor);
  if(state.weather==='fog'||W.fog>0.005){const f=ss(0.004,0.009,W.fog);P.hor.lerp(tmpC.setRGB(0.55,0.56,0.55).multiplyScalar(1-night*0.85),f*0.6);}
  // lightning
  if(W.lightning>0.5 && Math.random()<dt*0.35){state.flash=1;newBolt();}
  state.flash=Math.max(0,state.flash-dt*3.2);
  const flick=state.flash*(0.6+0.4*Math.sin(t*60));

  skyU.uTop.value.copy(P.top); skyU.uHorizon.value.copy(P.hor);
  skyU.uSunDir.value.copy(sunDir); skyU.uMoonDir.value.copy(moonDir); skyU.uSunColor.value.copy(P.sunC);
  skyU.uSunVis.value=(1-W.cloud*0.9)*ss(-0.05,0.02,sunDir.y);
  skyU.uMoonVis.value=(1-W.cloud)*night*ss(-0.02,0.05,moonDir.y);
  skyU.uFlash.value=flick;
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  stars.material.opacity=night*(1-W.cloud)*0.9;

  const lightDir=sunDir.y>-0.05?sunDir:moonDir;
  sun.position.copy(lightDir).multiplyScalar(400); sun.target.position.set(0,0,0);
  sun.color.copy(P.sunC); sun.intensity=P.sunI*(1-W.dark*0.75)*(1-W.cloud*0.35);
  hemi.intensity=P.hemiI*(1-W.dark*0.3)+flick*3; hemi.color.copy(P.top).lerp(tmpC.set(0xffffff),0.5);

  scene.fog.color.copy(P.hor); scene.fog.density=W.fog;
  waterU.uTime.value=t; waterU.uWave.value=W.wave; waterU.uSky.value.copy(P.top); waterU.uHorizon.value.copy(P.hor);
  waterU.uSunDir.value.copy(lightDir); waterU.uSunColor.value.copy(P.sunC).multiplyScalar(sunDir.y>0?1:0.3);
  waterU.uSpec.value=(1-W.cloud*0.9); waterU.uFogColor.value.copy(P.hor); waterU.uFogDensity.value=W.fog;
  waterU.uDeep.value.setRGB(0.012,0.05,0.07).multiplyScalar(0.15+0.85*(1-night)).multiplyScalar(1-W.dark*0.4);
  waterU.uFlash.value=flick;

  // city lights
  const glow=0.05+night*1.5+(1-night)*W.dark*0.35;
  facadeMats.forEach(m=>m.emissiveIntensity=glow);
  hillLights.material.opacity=night*0.9;
  signMats.forEach((m,i)=>m.opacity=0.25+night*0.75*(0.85+0.15*Math.sin(t*(3+i)+i)));
  streakMats.forEach(m=>m.opacity=night*0.55*(1-ss(0.003,0.009,W.fog)*0.8));
  streaks.forEach(s=>{s.scale.x=0.75+0.35*Math.sin(t*2+s.userData.ph)*(0.4+W.wave);});
  boatWin.opacity=night;
  navRed.visible=navGreen.visible=night>0.2;

  // Symphony of Lights
  const show = state.sym==='on' || (state.sym==='auto' && h>=20 && h<20+10/60);
  const showOn = show && night>0.4;
  lasers.forEach(L=>{L.pivot.visible=showOn;
    if(showOn){L.pivot.rotation.set(Math.sin(t*0.6+L.i)*0.9,t*0.4+L.i*0.9,Math.cos(t*0.5+L.i*1.3)*0.9);
      L.m.color.setHSL((t*0.12+L.i*0.13)%1,1,0.55);L.m.opacity=0.45+0.3*Math.sin(t*4+L.i);}});
  centerBands.forEach((m,i)=>{m.opacity=night*0.95;m.color.setHSL(((showOn?t*0.5:t*0.05)+i*0.05)%1,1,0.55);});
  cpBand.opacity=night*0.95; cpBand.color.copy(cpColors[((Math.floor(h)%6)+Math.floor((h%1)*4))%6]);
  iccShow.opacity=night*(showOn?0.45:0.18); iccShow.color.setHSL((t*(showOn?0.2:0.03))%1,0.9,0.5);
  wheelLight.opacity=0.3+night*0.7; wheelLight.color.setHSL((t*0.05)%1,0.8,0.6);
  ifcFin.opacity=0.4+night*0.6; if(showOn) ifcFin.color.setHSL((t*0.3)%1,1,0.7); else ifcFin.color.set(0xdfe8ff);
  wheel.rotation.z=-t*0.05;

  // boats
  const bob=0.5+W.wave*1.8;
  ferries.forEach(f=>{
    const T=60, u=((t+f.ph)%T)/T;
    let s,from=f.a,to=f.b;
    if(u<0.12)s=0; else if(u<0.5)s=ss(0.12,0.5,u); else if(u<0.62)s=1; else {s=1-ss(0.62,1,u);}
    const x=lerp(from.x,to.x,s), z=lerp(from.z,to.z,s);
    const dir=(u<0.56)?1:-1;
    boatPose(f.g,x,z,-Math.atan2((to.z-from.z)*dir,(to.x-from.x)*dir),t,bob);
  });
  {const x=((t*3)%700)-300; boatPose(junk,x,midZ(x)+10+Math.sin(t*0.1)*3,-Math.atan2(midZ(x+1)-midZ(x),1),t,bob);}
  {const x=420-((t*1.6)%800); boatPose(cargo,x,midZ(x)-14,-Math.atan2(midZ(x-1)-midZ(x),-1),t,bob*0.4);}
  speeds.forEach((s,i)=>{
    const P=a=>{const x=40+Math.cos(a)*(140-i*25);return [x,midZ(x)+Math.sin(a)*(16+i*3)];};
    const a=t*(0.12+i*0.03)+i*2, p0=P(a), p1=P(a+0.01);
    boatPose(s,p0[0],p0[1],-Math.atan2(p1[1]-p0[1],p1[0]-p0[0]),t,bob);});

  // clouds
  clouds.forEach((c,i)=>{c.position.x+=dt*(2+W.wind*10);if(c.position.x>800)c.position.x=-800;
    c.material.opacity=Math.min(1,W.cloud*(0.35+c.userData.k*0.65)*1.1);
    c.material.color.copy(P.hor).lerp(tmpC.set(night>0.5?0x2a2833:0xffffff),0.5).multiplyScalar(1-W.dark*0.5+flick*0.8);});

  // rain
  const n=Math.floor(W.rain*RAIN_MAX);
  if(n>0){const cx=camera.position.x,cy=camera.position.y,cz=camera.position.z,slant=W.wind*0.35,len=1.6+W.wind*0.6;
    for(let i=0;i<n;i++){const s=rainSeed[i];s[1]-=dt*70*s[3];if(s[1]<-20)s[1]+=120;s[0]+=dt*W.wind*12;if(s[0]>150)s[0]-=300;
      const x=cx+s[0],y=cy+s[1]-40,z=cz+s[2],o=i*6;
      rainPos[o]=x;rainPos[o+1]=y;rainPos[o+2]=z;rainPos[o+3]=x-slant*len;rainPos[o+4]=y+len;rainPos[o+5]=z;}
    rainGeo.attributes.position.needsUpdate=true;}
  rainGeo.setDrawRange(0,n*2); rain.visible=n>0;
  boltMat.opacity=state.flash>0.3?state.flash:0;

  // camera
  if(state.cam==='cruise'){cruiseT+=dt*0.03;
    const x=60+Math.cos(cruiseT)*230, z=midZ(x);
    camera.position.set(x,5+Math.sin(t*1.3)*0.15*bob,z);
    camera.lookAt(x-Math.sin(cruiseT)*60,14,z+(Math.cos(cruiseT)>0?100:-100));}
  else controls.update();

  // labels
  if(state.showLbl){labels.forEach(L=>{tmp.copy(L.p).project(camera);
    const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;L.d.style.display=vis?'':'none';
    if(vis){L.d.style.left=((tmp.x+1)/2*innerWidth)+'px';L.d.style.top=((1-tmp.y)/2*innerHeight)+'px';}});}

  $('status').innerHTML=`${fmt(h)} HKT · ${state.weather[0].toUpperCase()+state.weather.slice(1)}`+
    (showOn?'<br>✨ A Symphony of Lights in progress':(show?'<br>Light show waits for darkness':''))+
    (state.weather==='typhoon'?'<br>⚠ Typhoon signal: rough seas':'');
  renderer.render(scene,camera);
}
window.__hkStarted=true;
animate();
</script>
</body>
