<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",Arial,sans-serif}
  #ui{position:absolute;top:12px;left:12px;width:270px;background:rgba(8,18,26,.78);color:#e8f1f2;
      padding:12px 14px;border-radius:10px;font-size:13px;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  #ui h1{font-size:15px;margin:0 0 8px}
  #ui label{display:block;margin:8px 0 2px}
  #ui input[type=range]{width:100%}
  #ui .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

  #needle{position:absolute;left:50%;top:50%;width:0;height:0}

<body>
<div id="ui">
  <h1>Laguna Verde 海逸豪園 – Hung Hom</h1>
  <label>Time of day: <b id="tval">12:00</b></label>
  <input id="time" type="range" min="0" max="24" step="0.01" value="15.5">
  <label>Day speed (hours / second): <b id="sval">0.20</b></label>
  <input id="speed" type="range" min="0" max="2" step="0.01" value="0.2">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================================
   COORDINATE SYSTEM (corrected / mirrored version)
   North = -Z, South = +Z, East = +X, West = -X.
   Harbour lies to the WEST (x < -138) and SOUTH (z > 138) of Laguna Verde.
   Whampoa Garden & Harbourfront Landmark are to the NORTH, Hutchison Park
   to the NORTH-EAST, and the domed clubhouse on the EAST side.
   The default "Photo view" looks WEST from above the clubhouse, as in the map:
   harbour on the LEFT and FAR side, Hutchison Park bottom-right, Whampoa right.
   Plan helper P(u,v): u = map-right (north), v = map-down (east).
   ========================================================================= */
const S = 30, FH = 3.1;
const P = (u, v) => ({ x: v * S, z: -u * S });
const SHORE_W = -138, SHORE_S = 138, LAND_Y = 6, PODIUM_Y = 16;

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa9cfee, 0.00028);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 12000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.52;
controls.minDistance = 40;
controls.maxDistance = 3500;
controls.autoRotateSpeed = 0.6;
function photoView() { camera.position.set(560, 360, -30); controls.target.set(-20, 50, 0); controls.update(); }
function topView() { camera.position.set(40, 1300, 1); controls.target.set(40, 0, 0); controls.update(); }
photoView();

const root = new THREE.Group();
scene.add(root);

/* ---------- helpers ---------- */
const nightMats = [];
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = root, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function box(w, h, d, mat, x, y, z, parent = root, shadow = true) {   // y = bottom
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, parent, shadow);
}
const rnd = (a, b) => a + Math.random() * (b - a);
function std(color, o = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0 }, o)); }

/* ---------- procedural façade textures (8 bays x 16 floors per tile) ---------- */
function facadeTiles(kind) {
  const W = 256, H = 512, cw = 32, ch = 32;
  const c1 = document.createElement('canvas'); c1.width = W; c1.height = H;
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
  const g = c1.getContext('2d'), e = c2.getContext('2d');
  e.fillStyle = '#000'; e.fillRect(0, 0, W, H);
  const warm = ['#ffd9a0', '#ffc47a', '#fff1d6', '#ffe2b0', '#d8ecff'];
  for (let f = 0; f < 16; f++) for (let b = 0; b < 8; b++) {
    const x = b * cw, y = f * ch;
    if (kind === 'teal') {
      const k = rnd(-10, 10);
      g.fillStyle = `rgb(${52 + k},${118 + k},${120 + k})`; g.fillRect(x, y, cw, ch);
      g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x + 3, y + 8, 10, 22);
      g.fillStyle = '#e9eee8'; g.fillRect(x, y, cw, 6);
      g.fillStyle = '#9fc2bf'; g.fillRect(x, y, 2, ch);
    } else if (kind === 'white') {
      g.fillStyle = '#ece8df'; g.fillRect(x, y, cw, ch);
      g.fillStyle = '#6f8189'; g.fillRect(x + 6, y + 9, 20, 15);
    } else {
      const k = rnd(-6, 6);
      g.fillStyle = `rgb(${38 + k},${56 + k},${70 + k})`; g.fillRect(x, y, cw, ch);
      g.fillStyle = '#566a78'; g.fillRect(x, y, cw, 3); g.fillRect(x, y, 2, ch);
    }
    if (Math.random() < (kind === 'dark' ? 0.35 : 0.45)) {
      e.fillStyle = warm[(Math.random() * warm.length) | 0];
      e.globalAlpha = rnd(0.55, 1);
      if (kind === 'white') e.fillRect(x + 6, y + 9, 20, 15); else e.fillRect(x + 3, y + 7, cw - 5, ch - 8);
      e.globalAlpha = 1;
    }
  }
  const t1 = new THREE.CanvasTexture(c1), t2 = new THREE.CanvasTexture(c2);
  t1.colorSpace = t2.colorSpace = THREE.SRGBColorSpace;
  t1.anisotropy = t2.anisotropy = 8;
  return { map: t1, emi: t2 };
}
const TILES = { teal: facadeTiles('teal'), white: facadeTiles('white'), dark: facadeTiles('dark') };
function facadeMat(kind, bays, floors, o = {}) {
  const T = TILES[kind];
  const map = T.map.clone(), emi = T.emi.clone();
  for (const t of [map, emi]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(bays / 8, floors / 16);
    t.offset.set(Math.random(), Math.random());
    t.needsUpdate = true;
  }
  const m = new THREE.MeshStandardMaterial(Object.assign({
    map, emissiveMap: emi, emissive: 0xffffff, emissiveIntensity: 0,
    roughness: kind === 'white' ? 0.8 : 0.35, metalness: kind === 'white' ? 0 : 0.25
  }, o));
  nightMats.push(m); return m;
}

/* ---------- shared materials ---------- */
const M = {
  land: std(0x8d8a82), prom: std(0xcdb89a), wall: std(0x77736b), road: std(0x3a3c40, { roughness: 0.95 }),
  podium: std(0xd4c6a6), stone: std(0xd9c9a7), roof: std(0xb8b8b1), roofDk: std(0x8e8f8a),
  green: std(0x5f8f4c), grass: std(0x6d9a55), plaza: std(0x4a4d4f),
  dome: std(0x5e8e88, { roughness: 0.5, metalness: 0.2 }), glassRoof: std(0x9fb6c4, { roughness: 0.15, metalness: 0.6 }),
  redRoof: std(0xb4553c), hill: std(0x2f4a33, { roughness: 1 }), hill2: std(0x3c5a3c, { roughness: 1 }),
  pool: new THREE.MeshStandardMaterial({ color: 0x2aa7d8, roughness: 0.1, metalness: 0.1, emissive: 0x1fb6e0, emissiveIntensity: 0 }),
  lamp: new THREE.MeshBasicMaterial({ color: 0x555555 }), pole: std(0x444444),
};

/* =========================================================================
   LAND, PROMENADES, ROADS
   ========================================================================= */
box(1240, 16, 1440, M.land, (SHORE_W + 1102) / 2, LAND_Y - 16, (SHORE_S - 1302) / 2);        // Kowloon side
box(3600, 16, 1200, M.land, -200, 4 - 16, 1500);                                              // HK Island shore (south)
box(1400, 16, 1500, M.land, -1300, 4 - 16, -850);                                             // TST East (west)
box(4, 8, 1440, M.wall, SHORE_W + 2, -2, (SHORE_S - 1302) / 2);
box(1240, 8, 4, M.wall, (SHORE_W + 1102) / 2, -2, SHORE_S - 2);
box(12, 0.4, 1440, M.prom, SHORE_W + 6, LAND_Y, (SHORE_S - 1302) / 2);                        // west promenade
box(1240, 0.4, 12, M.prom, (SHORE_W + 1102) / 2, LAND_Y, SHORE_S - 6);                        // south promenade
box(16, 0.3, 1400, M.road, 258, LAND_Y, -560);
box(1100, 0.3, 14, M.road, 500, LAND_Y, -420);
box(14, 0.3, 240, M.road, 172, LAND_Y, -12);
box(14, 3, 70, M.prom, 200, 3, SHORE_S + 35);                                                 // pier
box(12, 6, 10, M.stone, 200, 6, SHORE_S + 62);

/* ---------- promenade lamps (instanced) ---------- */
const lampPts = [];
for (let z = -700; z <= 130; z += 20) lampPts.push([SHORE_W + 3, z]);
for (let x = -130; x <= 700; x += 20) lampPts.push([x, SHORE_S - 3]);
const lampHead = new THREE.InstancedMesh(new THREE.SphereGeometry(0.9, 8, 6), M.lamp, lampPts.length);
const lampPole = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.2, 6, 5), M.pole, lampPts.length);
const dummy = new THREE.Object3D();
lampPts.forEach(([x, z], i) => {
  dummy.position.set(x, LAND_Y + 6.5, z); dummy.updateMatrix(); lampHead.setMatrixAt(i, dummy.matrix);
  dummy.position.set(x, LAND_Y + 3, z); dummy.updateMatrix(); lampPole.setMatrixAt(i, dummy.matrix);
});
root.add(lampHead, lampPole);

/* ---------- trees ---------- */
const treeData = [];
function tree(x, y, z, s) { treeData.push([x, y, z, s]); }
function inRect(x, z, x0, x1, z0, z1) { return x >= x0 && x <= x1 && z >= z0 && z <= z1; }

/* =========================================================================
   LAGUNA VERDE TOWERS (layout follows laguna 2.png)
   ========================================================================= */
const TOWERS = [
  // name,  u,    v,   floors, roof type
  ['16', -2.0, -3.1, 45, 'round'], ['17', -0.8, -3.3, 45, 'round'], ['18', 0.5, -3.4, 45, 'round'],
  ['19',  2.3, -3.3, 44, 'crown'], ['20',  3.2, -2.3, 34, 'flat'],  ['21', 0.7, -1.8, 36, 'flat'],
  ['22',  1.9, -1.5, 36, 'flat'],  ['15', -3.3, -1.8, 30, 'flat'],  ['15A', -3.5, -0.9, 30, 'flat'],
  ['13', -3.6,  0.1, 32, 'flat'],  ['12', -2.2,  0.1, 33, 'flat'],  ['11', -0.7, -1.0, 33, 'flat'],
  ['10', -0.9,  0.0, 34, 'flat'],  ['9',  -0.6,  1.0, 34, 'flat'],  ['8',  -2.8,  1.8, 34, 'flat'],
  ['7',  -0.8,  2.1, 35, 'flat'],  ['6',   0.9,  1.9, 35, 'flat'],  ['5',   1.2,  0.5, 36, 'flat'],
  ['3',   2.6, -0.4, 38, 'flat'],  ['2',   3.6, -0.9, 36, 'flat'],  ['1',   3.4,  0.6, 38, 'flat'],
];
const towerPos = {};
const labelDefs = [];

function buildTower([name, u, v, floors, type]) {
  const { x, z } = P(u, v);
  const h = floors * FH;
  const g = new THREE.Group(); g.position.set(x, PODIUM_Y, z); root.add(g);
  const coreMat = facadeMat('teal', 5, floors), lobeMat = facadeMat('teal', 11, floors);
  box(24, 12, 24, M.stone, 0, 0, 0, g);
  box(18, h, 18, coreMat, 0, 0, 0, g);
  for (const [dx, dz] of [[7, 7], [7, -7], [-7, 7], [-7, -7]]) {
    mesh(new THREE.CylinderGeometry(7.2, 7.2, h, 28, 1, true), lobeMat, dx, h / 2, dz, g);
    mesh(new THREE.CylinderGeometry(7.7, 7.7, 1.6, 28), M.roof, dx, h + 0.8, dz, g);
  }
  box(20, 1.6, 20, M.roof, 0, h, 0, g);
  box(10, 5, 10, M.roofDk, 0, h + 1.6, 0, g);
  if (type === 'round') {
    mesh(new THREE.CylinderGeometry(6, 6.5, 9, 28), M.roof, 0, h + 6, 0, g);
    mesh(new THREE.CylinderGeometry(7.2, 7.2, 1.2, 28), M.roofDk, 0, h + 11, 0, g);
  } else if (type === 'crown') {
    for (const [dx, dz] of [[7, 7], [7, -7], [-7, 7], [-7, -7]]) box(4, 7, 4, M.roof, dx, h + 1.6, dz, g);
  }
  towerPos[name] = { x, z, h };
  labelDefs.push({ html: `Laguna Verde Block ${name}<br>海逸豪園${name}座`, x, y: PODIUM_Y + h + 16, z });
}
TOWERS.forEach(buildTower);

function connect(a, b) {
  const A = towerPos[a], B = towerPos[b];
  const len = Math.hypot(B.x - A.x, B.z - A.z), h = Math.min(A.h, B.h) * 0.92;
  const m = mesh(new THREE.BoxGeometry(len, h, 12), facadeMat('teal', Math.max(2, len / 5), h / FH),
                 (A.x + B.x) / 2, PODIUM_Y + h / 2, (A.z + B.z) / 2);
  m.rotation.y = -Math.atan2(B.z - A.z, B.x - A.x);
}
[['15', '15A'], ['15A', '13'], ['16', '17'], ['17', '18'], ['8', '7'], ['7', '6'], ['12', '13']].forEach(p => connect(...p));

/* ---------- estate podium & landscaping ---------- */
const PX0 = -126, PX1 = 96, PZ0 = -126, PZ1 = 126;
box(PX1 - PX0, PODIUM_Y - LAND_Y, PZ1 - PZ0, M.podium, (PX0 + PX1) / 2, LAND_Y, (PZ0 + PZ1) / 2);
box(PX1 - PX0 - 4, 0.4, PZ1 - PZ0 - 4, M.grass, (PX0 + PX1) / 2, PODIUM_Y, (PZ0 + PZ1) / 2, root, false);
box(40, 0.6, 30, M.plaza, -40, PODIUM_Y, 15, root, false);
box(26, 0.8, 12, M.pool, 30, PODIUM_Y, 60, root, false);
for (let i = 0; i < 400; i++) {
  const x = rnd(PX0 + 5, PX1 - 5), z = rnd(PZ0 + 5, PZ1 - 5);
  if (Object.values(towerPos).some(t => Math.hypot(t.x - x, t.z - z) < 21)) continue;
  if (inRect(x, z, -62, -18, -2, 32) || inRect(x, z, 14, 46, 52, 68)) continue;
  tree(x, PODIUM_Y, z, rnd(2.2, 3.6));
}

/* =========================================================================
   EAST CLUBHOUSE (green domes, rotunda, glass roof, tennis courts) + pool
   ========================================================================= */
const CX0 = 96, CX1 = 162, CZ0 = -84, CZ1 = 110;
box(CX1 - CX0, 12, CZ1 - CZ0, M.stone, (CX0 + CX1) / 2, LAND_Y, (CZ0 + CZ1) / 2);
const CT = LAND_Y + 12;
mesh(new THREE.CylinderGeometry(20, 20, 5, 40), M.stone, 132, CT + 2.5, 18);
mesh(new THREE.CylinderGeometry(12, 12, 4, 40), M.roof, 132, CT + 7, 18);
mesh(new THREE.TorusGeometry(16, 0.8, 8, 48), M.roofDk, 132, CT + 5.2, 18).rotation.x = Math.PI / 2;
box(26, 3, 22, M.glassRoof, 138, CT, 50);
for (const [dx, dz] of [[117, 87], [114, -57]]) {
  mesh(new THREE.CylinderGeometry(8.5, 8.5, 8, 28), M.stone, dx, CT + 4, dz);
  mesh(new THREE.SphereGeometry(8.5, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), M.dome, dx, CT + 8, dz);
  mesh(new THREE.CylinderGeometry(0.4, 0.4, 4, 6), M.roofDk, dx, CT + 18, dz);
}
{
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#3f8a5a'; g.fillRect(0, 0, 256, 256); g.fillStyle = '#2f7048'; g.fillRect(20, 16, 216, 100); g.fillRect(20, 140, 216, 100);
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(20, 16, 216, 100); g.strokeRect(20, 140, 216, 100);
  g.beginPath(); g.moveTo(128, 16); g.lineTo(128, 116); g.moveTo(128, 140); g.lineTo(128, 240); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const court = mesh(new THREE.PlaneGeometry(40, 42), std(0xffffff, { map: t }), 136, CT + 0.05, -27, root, false);
  court.rotation.x = -Math.PI / 2;
}
box(55, 0.8, 18, M.pool, 128, LAND_Y, 121, root, false);
labelDefs.push({ html: 'Clubhouse', x: 132, y: CT + 22, z: 18 });

/* =========================================================================
   NORTH: Kindergarten, Sub-station, Whampoa Garden, Harbourfront Landmark
   ========================================================================= */
box(34, 10, 20, M.stone, -80, LAND_Y, -150); box(36, 0.6, 22, M.roof, -80, LAND_Y + 10, -150);
labelDefs.push({ html: 'Anfield International Kindergarten<br>安菲爾國際幼稚園', x: -80, y: 40, z: -150 });
box(22, 0.8, 14, M.pool, -112, LAND_Y, -160, root, false);
labelDefs.push({ html: 'Hung Hom Promenade<br>紅磡海濱', x: -128, y: 30, z: -175, cls: 'big' });
box(34, 22, 28, std(0xb49c80), 9, LAND_Y, -156);
labelDefs.push({ html: 'Electric Sub-station<br>電力站', x: 9, y: 50, z: -156 });

const wMats = [facadeMat('white', 5, 16), facadeMat('white', 5, 18)];
function whampoaBlock(x, z, floors) {
  const h = floors * FH, m = wMats[floors > 16 ? 1 : 0];
  box(24, h, 9, m, x, LAND_Y + 6, z); box(9, h, 24, m, x, LAND_Y + 6, z);
  box(26, 1.2, 10, M.roof, x, LAND_Y + 6 + h, z); box(10, 1.2, 26, M.roof, x, LAND_Y + 6 + h, z);
}
box(150, 6, 180, M.stone, -45, LAND_Y, -265);
for (let i = 0; i < 4; i++) for (let j = 0; j < 5; j++) whampoaBlock(-105 + i * 38, -190 - j * 38, 16 + (j % 2) * 2);
for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) whampoaBlock(60 + i * 40, -340 - j * 40, 16);
labelDefs.push({ html: 'Whampoa Garden Site 10<br>黃埔花園', x: -60, y: 90, z: -250 });
labelDefs.push({ html: 'Whampoa Garden Site 12<br>黃埔花園十二期', x: 120, y: 90, z: -360 });

const dMat = facadeMat('dark', 5, 65);
for (let i = 0; i < 3; i++) {
  const z = -410 - i * 34, h = (60 + i * 3) * FH;
  box(22, h, 22, dMat, -105, LAND_Y, z); box(14, 12, 14, M.roofDk, -105, LAND_Y + h, z);
}
labelDefs.push({ html: 'Harbourfront Landmark<br>海濱南岸', x: -105, y: 240, z: -444 });

/* =========================================================================
   HUTCHISON PARK (north-east)
   ========================================================================= */
box(210, 0.6, 160, M.green, 140, LAND_Y, -220, root, false);
box(80, 0.6, 240, M.green, 205, LAND_Y, -20, root, false);
for (let x = 36; x <= 245; x += 6.5) for (let z = -300; z <= 100; z += 6.5) {
  const X = x + rnd(-2.5, 2.5), Z = z + rnd(-2.5, 2.5);
  const inPark = inRect(X, Z, 36, 245, -300, -140) || inRect(X, Z, 168, 245, -140, 100);
  if (!inPark || inRect(X, Z, 100, 140, -190, -150) || Math.abs(X - 258) < 12) continue;
  tree(X, LAND_Y + rnd(0, 6), Z, rnd(3.5, 5.5));
}
box(24, 5, 18, std(0xe6dccb), 120, LAND_Y, -170);

/* =========================================================================
   OCEAN – waves, fresnel reflection, sun glint, foam, night light streaks
   ========================================================================= */
const WAVES = [[1, 0.3, 0.045, 1.2, 1.1], [-0.4, 1, 0.07, 0.7, 1.4], [0.7, -0.7, 0.12, 0.35, 1.9]].map(
  ([dx, dz, k, a, s]) => { const l = Math.hypot(dx, dz); return [dx / l, dz / l, k, a, s]; });
function waveAt(x, z, t, amp) {
  let h = 0, gx = 0, gz = 0;
  for (const [dx, dz, k, a, s] of WAVES) { const ph = k * (dx * x + dz * z) + s * t; h += a * Math.sin(ph); gx += a * k * dx * Math.cos(ph); gz += a * k * dz * Math.cos(ph); }
  return { h: h * amp, gx: gx * amp, gz: gz * amp };
}
const waterU = {
  uTime: { value: 0 }, uAmp: { value: 1 }, uSunDir: { value: new THREE.Vector3() }, uMoonDir: { value: new THREE.Vector3() },
  uSunColor: { value: new THREE.Color() }, uSunI: { value: 1 }, uNight: { value: 0 }, uLight: { value: 1 },
  uSkyTop: { value: new THREE.Color() }, uSkyHor: { value: new THREE.Color() }, uDeep: { value: new THREE.Color(0x0f5a55) },
  uFogColor: { value: new THREE.Color() }, uFogDensity: { value: 0.00028 },
};
const waveGLSL = WAVES.map(([dx, dz, k, a, s]) =>
  `W(vec2(${dx.toFixed(4)},${dz.toFixed(4)}),${k.toFixed(4)},${a.toFixed(4)},${s.toFixed(4)});`).join('\n');
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterU,
  vertexShader: `
    uniform float uTime, uAmp; varying vec3 vW; varying vec3 vN;
    float h, gx, gz; vec2 p;
    void W(vec2 d, float k, float a, float s){ float ph=k*dot(d,p)+s*uTime; h+=a*sin(ph); gx+=a*k*d.x*cos(ph); gz+=a*k*d.y*cos(ph); }
    void main(){
      vec4 w = modelMatrix*vec4(position,1.0); p = w.xz; h=0.; gx=0.; gz=0.;
      ${waveGLSL}
      w.y += h*uAmp; vW = w.xyz; vN = normalize(vec3(-gx*uAmp,1.0,-gz*uAmp));
      gl_Position = projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader: `
    uniform float uTime, uAmp, uSunI, uNight, uLight, uFogDensity;
    uniform vec3 uSunDir, uMoonDir, uSunColor, uSkyTop, uSkyHor, uDeep, uFogColor;
    varying vec3 vW; varying vec3 vN;
    float streak(float along, float d, float seed, vec3 n){
      if(d>1e4) return 0.;
      float cell=floor(along/7.0); float r=fract(sin(cell*12.9898+seed)*43758.5453);
      float on=step(0.42,r); float w=exp(-d/(40.0+r*90.0));
      float fl=0.55+0.45*sin(d*0.35+uTime*2.0+n.x*25.0+r*6.0);
      return on*w*fl;
    }
    void main(){
      vec2 p=vW.xz; float dist=length(cameraPosition-vW);
      float gx=0., gz=0.;
      vec4 K=vec4(0.5,0.83,1.3,2.1); vec4 A=vec4(0.10,0.06,0.035,0.02);
      vec2 D0=vec2(0.8,0.6), D1=vec2(-0.6,0.8), D2=vec2(0.2,-1.0), D3=vec2(-0.9,-0.4);
      float f=exp(-dist/900.0)*(0.3+0.7*uAmp);
      float c0=cos(K.x*dot(D0,p)+uTime*2.3), c1=cos(K.y*dot(D1,p)+uTime*2.9), c2=cos(K.z*dot(D2,p)+uTime*3.6), c3=cos(K.w*dot(D3,p)+uTime*4.4);
      gx=(A.x*K.x*D0.x*c0+A.y*K.y*D1.x*c1+A.z*K.z*D2.x*c2+A.w*K.w*D3.x*c3)*f;
      gz=(A.x*K.x*D0.y*c0+A.y*K.y*D1.y*c1+A.z*K.z*D2.y*c2+A.w*K.w*D3.y*c3)*f;
      vec3 n=normalize(vN+vec3(-gx,0.,-gz));
      vec3 V=normalize(cameraPosition-vW);
      float fres=0.02+0.98*pow(1.0-max(dot(n,V),0.0),5.0);
      vec3 R=reflect(-V,n); R.y=abs(R.y);
      vec3 sky=mix(uSkyHor,uSkyTop,pow(clamp(R.y,0.,1.),0.5));
      vec3 deep=uDeep*(0.12+0.88*uLight);
      vec3 col=mix(deep,sky,clamp(fres,0.,1.)*0.8);
      float sd=max(dot(R,uSunDir),0.);
      col+=uSunColor*(pow(sd,350.0)*6.0+pow(sd,40.0)*0.15)*uSunI;
      col+=vec3(0.8,0.85,1.0)*pow(max(dot(R,uMoonDir),0.),500.0)*uNight*1.6;
      float dW = vW.x < ${SHORE_W.toFixed(1)} ? (${SHORE_W.toFixed(1)} - vW.x) : 1e5;
      float dS = vW.z > ${SHORE_S.toFixed(1)} && vW.x > ${SHORE_W.toFixed(1)} ? (vW.z - ${SHORE_S.toFixed(1)}) : 1e5;
      float dI = vW.z < 900.0 ? (900.0 - vW.z) : 1e5;
      float dK = (vW.z < -120.0 && vW.x > -600.0) ? (vW.x + 600.0) : 1e5;
      vec3 lights = vec3(1.0,0.75,0.45)*(streak(vW.z,dW,1.0,n)+streak(vW.x,dS,2.0,n))
                  + vec3(0.9,0.85,1.0)*streak(vW.x,dI,3.0,n)*0.9
                  + vec3(1.0,0.8,0.6)*streak(vW.z,dK,4.0,n)*0.6;
      col += lights*uNight;
      float dm=min(min(dW,dS),min(dI,dK));
      col += vec3(0.85)*exp(-dm/3.0)*0.3*(0.5+0.5*sin(uTime*2.0+dm*0.8))*(0.2+0.8*uLight);
      float fg=1.0-exp(-uFogDensity*uFogDensity*dist*dist);
      col=mix(col,uFogColor,fg);
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});

/* ---------- day / night update ---------- */
const C = (h) => new THREE.Color(h);
const PAL = { dayTop: C(0x3a7bd5), dayHor: C(0xb4d6ef), nightTop: C(0x02060f), nightHor: C(0x0b1630), dusk: C(0xff8a4a),
              sunLow: C(0xff7a33), sunHigh: C(0xfff4e0) };
const sunDir = new THREE.Vector3(), moonDir = new THREE.Vector3();
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
function updateSky(t) {
  const th = (t - 6) / 12 * Math.PI;   // rises EAST (+x), high in SOUTH (+z), sets WEST (-x)
  sunDir.set(Math.cos(th), Math.sin(th) * 0.92, Math.sin(th) * 0.40).normalize();
  moonDir.set(-Math.cos(th), -Math.sin(th) * 0.85, 0.35).normalize();
  const e = sunDir.y;
  const day = smooth(-0.05, 0.25, e), dusk = Math.exp(-Math.pow(e / 0.12, 2)), night = 1 - smooth(-0.16, 0.02, e);
  const top = PAL.nightTop.clone().lerp(PAL.dayTop, day);
  const hor = PAL.nightHor.clone().lerp(PAL.dayHor, day).lerp(PAL.dusk, dusk * 0.75);
  const sc = PAL.sunLow.clone().lerp(PAL.sunHigh, smooth(0, 0.35, e));
  const sI = 3.0 * smooth(-0.03, 0.12, e);

  skyU.uTop.value.copy(top); skyU.uHor.value.copy(hor); skyU.uSunDir.value.copy(sunDir); skyU.uMoonDir.value.copy(moonDir);
  skyU.uSunColor.value.copy(sc); skyU.uNight.value = night; skyU.uSunVis.value = smooth(-0.08, 0.02, e);
  starMat.opacity = night;

  sun.position.copy(sun.target.position).addScaledVector(sunDir, 1000);
  sun.color.copy(sc); sun.intensity = sI; sun.castShadow = sI > 0.01;
  moon.position.copy(sun.target.position).addScaledVector(moonDir, 1000); moon.intensity = 0.35 * night;
  hemi.color.copy(top).lerp(C(0xffffff), 0.4); hemi.intensity = 0.12 + 0.6 * day + 0.15 * dusk;
  scene.fog.color.copy(hor);
  renderer.toneMappingExposure = 0.85 + 0.4 * night;

  waterU.uSunDir.value.copy(sunDir); waterU.uMoonDir.value.copy(moonDir);
  waterU.uSunColor.value.copy(sc); waterU.uSunI.value = sI / 3; waterU.uNight.value = night; waterU.uLight.value = 0.1 + 0.9 * day + 0.3 * dusk;
  waterU.uSkyTop.value.copy(top); waterU.uSkyHor.value.copy(hor); waterU.uFogColor.value.copy(hor);

  const glow = night * 1.1 + dusk * 0.25;
  for (const m of nightMats) m.emissiveIntensity = glow;
  M.lamp.color.setRGB(0.33 + 2.2 * night, 0.33 + 1.6 * night, 0.33 + 0.8 * night);
  M.pool.emissiveIntensity = 0.6 * night;
  for (const b of boats) b.mesh.userData.lightMat.color.setRGB(0.13 + 1.8 * night, 0.13 + 1.5 * night, 0.13 + 0.9 * night);
}

const labelLayer = document.getElementById('labels');
const labels = labelDefs.map(d => {
  const el = document.createElement('div'); el.className = 'lbl ' + (d.cls || ''); el.innerHTML = d.html; labelLayer.appendChild(el);
  const anchor = new THREE.Object3D(); anchor.position.set(d.x, d.y, d.z); root.add(anchor);
  return { el, anchor };
});
const tmpV = new THREE.Vector3();
function updateLabels() {
  if (labelLayer.style.display === 'none') return;
  for (const L of labels) {
    L.anchor.getWorldPosition(tmpV); const dist = tmpV.distanceTo(camera.position); tmpV.project(camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.1 || Math.abs(tmpV.y) > 1.1 || dist > 2600) { L.el.style.display = 'none'; continue; }
    L.el.style.display = 'block';
    L.el.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px';
    L.el.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
    L.el.style.opacity = dist > 1600 ? 0.6 : 1;
  }
}
const needle = document.getElementById('needle'), fwd = new THREE.Vector3();
function updateCompass() {
  camera.getWorldDirection(fwd);
  if (Math.hypot(fwd.x, fwd.z) < 1e-3) fwd.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const ang = Math.atan2(-fwd.x, -fwd.z);          // North (-Z) angle, clockwise from screen-up
  needle.style.transform = `rotate(${ang}rad)`;
}

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =========================================================================
   ANIMATION LOOP
   ========================================================================= */
const clock = new THREE.Clock(); let wt = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  wt += dt;
  if (playing) { time = (time + dt * speed) % 24; $('time').value = time; }
  $('tval').textContent = fmt(time);
  updateSky(time);
  waterU.uTime.value = wt;

  for (const b of boats) {
    let s = ((b.off + b.speed * wt) % b.len + b.len) % b.len + b.start;
    const x = b.axis === 'x' ? s : b.fixed, z = b.axis === 'x' ? b.fixed : s;
    const w = waveAt(x, z, wt, waterU.uAmp.value);
    b.mesh.position.set(x, w.h + 1.2, z);
    const heading = b.axis === 'x' ? (b.speed > 0 ? 0 : Math.PI) : (b.speed > 0 ? -Math.PI / 2 : Math.PI / 2);
    b.mesh.rotation.set(w.gz * 0.8, heading, -w.gx * 0.8, 'YXZ');
  }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  controls.update();
  updateLabels();
  updateCompass();
  renderer.render(scene, camera);
});
