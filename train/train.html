<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Woodland Model Railway</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				overflow: hidden;
				background: #c4d8df;
				font-family: system-ui, sans-serif;
				color: #edf2ec;
			}
			canvas {
				display: block;
			}
			#panel {
				position: absolute;
				top: 16px;
				left: 16px;
				width: 285px;
				padding: 18px;
				background: #172820ed;
				border: 1px solid #ffffff22;
				border-radius: 14px;
				box-shadow: 0 12px 32px #0003;
			}
			h1 {
				font-size: 19px;
				margin: 0 0 6px;
			}
			p {
				font-size: 12px;
				line-height: 1.5;
				color: #b9cbbd;
				margin: 0 0 14px;
			}
			label {
				display: block;
				font-size: 12px;
				margin: 13px 0 7px;
			}
			.row {
				display: flex;
				gap: 7px;
			}
			button {
				flex: 1;
				padding: 9px 7px;
				border-radius: 7px;
				border: 1px solid #ffffff25;
				background: #ffffff0b;
				color: #e3ece2;
				cursor: pointer;
				font: inherit;
				font-size: 12px;
			}
			button.active {
				background: #d9a54b;
				color: #241e13;
			}
			button:hover {
				filter: brightness(1.15);
			}
			input {
				width: 100%;
				accent-color: #d9a54b;
			}
			#status {
				margin-top: 13px;
				font-size: 12px;
				line-height: 1.6;
				color: #b5cab7;
			}
			#hint {
				position: absolute;
				bottom: 16px;
				left: 50%;
				transform: translateX(-50%);
				padding: 10px 18px;
				border-radius: 25px;
				background: #172820db;
				font-size: 12px;
				pointer-events: none;
				text-align: center;
				white-space: nowrap;
			}
			@media (max-width: 600px) {
				#panel {
					width: 240px;
					top: 10px;
					left: 10px;
					padding: 13px;
				}
				#hint {
					white-space: normal;
					width: 90%;
				}
			}
		</style>
	</head>
	<body>
		<div id="panel">
			<h1>Woodland Model Railway</h1>
			<p>
				Steam, steel and scenery. Switch routes before the locomotive
				reaches a junction.
			</p>
			<label>Junction A · northern route</label>
			<div class="row">
				<button id="a0" class="active">Tunnel</button>
				<button id="a1">Pond side</button>
			</div>
			<label>Junction B · southern route</label>
			<div class="row">
				<button id="b0" class="active">Woodland rise</button>
				<button id="b1">Lake side</button>
			</div>
			<label>Throttle <span id="speedText">45%</span></label>
			<input id="speed" type="range" min="0" max="100" value="45" />
			<div class="row" style="margin-top: 12px">
				<button id="pause">Pause</button>
				<button id="view">Follow train</button>
			</div>
			<div id="status"></div>
		</div>
		<div id="hint">
			Drag to orbit · Scroll to zoom · Click orange switch levers
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from "three";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";

			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0xc4d8df);
			scene.fog = new THREE.Fog(0xc4d8df, 55, 110);

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(innerWidth, innerHeight);
			renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = THREE.PCFSoftShadowMap;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = 1.12;
			document.body.appendChild(renderer.domElement);

			const camera = new THREE.PerspectiveCamera(
				43,
				innerWidth / innerHeight,
				0.1,
				160,
			);
			camera.position.set(29, 30, 35);
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.target.set(0, 0, 0);
			controls.enableDamping = true;
			controls.maxPolarAngle = Math.PI * 0.48;
			controls.minDistance = 6;
			controls.maxDistance = 68;

			scene.add(new THREE.HemisphereLight(0xe1f2ff, 0x66714c, 2));
			const sun = new THREE.DirectionalLight(0xffe6bd, 3);
			sun.position.set(-15, 30, 16);
			sun.castShadow = true;
			sun.shadow.mapSize.set(2048, 2048);
			Object.assign(sun.shadow.camera, {
				left: -25,
				right: 25,
				top: 23,
				bottom: -23,
				near: 1,
				far: 75,
			});
			sun.shadow.bias = -0.00025;
			scene.add(sun);

			const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
			const UP = V(0, 1, 0);
			const Z = V(0, 0, 1);
			const material = (color, roughness = 0.85, metalness = 0) =>
				new THREE.MeshStandardMaterial({ color, roughness, metalness });

			const mats = {
				grass: material(0x718650),
				edge: material(0x393b31),
				soil: material(0x62563e),
				wood: material(0x70523b),
				sleeper: material(0x493c30),
				ballast: material(0x827d70),
				steel: material(0xb1b7b6, 0.28, 0.8),
				darkSteel: material(0x303638, 0.4, 0.6),
				green: material(0x163f30, 0.34, 0.45),
				black: material(0x141b1d, 0.42, 0.45),
				brass: material(0xc6a152, 0.3, 0.75),
				red: material(0x9f3026, 0.55, 0.2),
				cream: material(0xd8cbb0),
				glass: material(0x395d69, 0.18, 0.3),
				stone: material(0x8e8c80),
				leaf: [0x365c39, 0x456b3d, 0x577743, 0x647d46].map((c) =>
					material(c),
				),
			};
			function addMesh(geometry, mat, parent = scene) {
				const m = new THREE.Mesh(geometry, mat);
				m.castShadow = true;
				m.receiveShadow = true;
				parent.add(m);
				return m;
			}
			function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
				const m = addMesh(new THREE.BoxGeometry(w, h, d), mat, parent);
				m.position.set(x, y, z);
				return m;
			}
			function cylinder(
				r1,
				r2,
				h,
				mat,
				x = 0,
				y = 0,
				z = 0,
				parent = scene,
				n = 20,
			) {
				const m = addMesh(
					new THREE.CylinderGeometry(r1, r2, h, n),
					mat,
					parent,
				);
				m.position.set(x, y, z);
				return m;
			}
			function ball(r, mat, x, y, z, parent = scene, detail = 1) {
				const m = addMesh(
					new THREE.IcosahedronGeometry(r, detail),
					mat,
					parent,
				);
				m.position.set(x, y, z);
				return m;
			}
			function beam(a, b, width, height, mat, parent = scene) {
				const m = box(
					width,
					height,
					a.distanceTo(b),
					mat,
					0,
					0,
					0,
					parent,
				);
				m.position.copy(a).add(b).multiplyScalar(0.5);
				m.quaternion.setFromUnitVectors(
					Z,
					b.clone().sub(a).normalize(),
				);
				return m;
			}

			// Repeatable landscaping.
			let seed = 59281;
			function random() {
				seed = (seed * 1664525 + 1013904223) >>> 0;
				return seed / 4294967296;
			}

			// Base board.
			box(40, 0.8, 29, mats.edge, 0, -0.43, 0);
			box(39, 0.12, 28, mats.grass, 0, -0.015, 0);

			// Paths use shared end tangents: all branches meet smoothly.
			const railY = 0.18;
			function path(points) {
				return new THREE.CatmullRomCurve3(
					points.map((p) => V(...p)),
					false,
					"centripetal",
				);
			}
			const A = [
				path([
					[-15, railY, -3],
					[-15, railY, -5],
					[-13, railY, -8],
					[-9, railY, -10],
					[-5, railY, -10],
					[0, railY, -10],
					[7, railY, -10],
					[12, railY, -8],
					[15, railY, -4],
					[15, railY, 1],
					[15, railY, 3],
				]),
				path([
					[-15, railY, -3],
					[-15, railY, -5],
					[-11, railY, -6],
					[-6, railY, -5],
					[0, railY, -5],
					[7, railY, -5],
					[12, railY, -4],
					[15, railY, 1],
					[15, railY, 3],
				]),
			];
			const B = [
				path([
					[15, railY, 3],
					[15, railY, 5],
					[13, 0.38, 8],
					[9, 0.68, 10],
					[3, 0.68, 10],
					[-3, 0.45, 10],
					[-10, railY, 9],
					[-14, railY, 6],
					[-15, railY, 2],
					[-15, railY, -1],
					[-15, railY, -3],
				]),
				path([
					[15, railY, 3],
					[15, railY, 5],
					[11, railY, 6],
					[5, railY, 5],
					[0, railY, 5],
					[-6, railY, 5],
					[-12, railY, 4],
					[-15, railY, 0],
					[-15, railY, -1],
					[-15, railY, -3],
				]),
			];
			const paths = [...A, ...B];
			const samples = paths.map((c) =>
				Array.from({ length: 401 }, (_, i) => c.getPointAt(i / 400)),
			);
			function nearTrack(x, z, d = 1.2) {
				return samples.some((list) =>
					list.some((p) => Math.hypot(x - p.x, z - p.z) < d),
				);
			}
			function side(c, t) {
				return UP.clone().cross(c.getTangentAt(t)).normalize();
			}

			// The ballast is a flat ribbon, not a tube.
			// Rails have a foot, web and polished head.
			function ribbon(c, width, offset, mat) {
				const vertices = [],
					indices = [];
				const steps = Math.ceil(c.getLength() / 0.14);
				for (let i = 0; i <= steps; i++) {
					const t = i / steps,
						p = c.getPointAt(t),
						s = side(c, t);
					for (const sign of [-1, 1]) {
						const q = p
							.clone()
							.addScaledVector(s, (sign * width) / 2);
						q.y += offset;
						vertices.push(q.x, q.y, q.z);
					}
					if (i < steps) {
						const k = i * 2;
						indices.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
					}
				}
				const g = new THREE.BufferGeometry();
				g.setAttribute(
					"position",
					new THREE.Float32BufferAttribute(vertices, 3),
				);
				g.setIndex(indices);
				g.computeVertexNormals();
				const m = mat.clone();
				m.side = THREE.DoubleSide;
				return addMesh(g, m);
			}
			const sleeperGeo = new THREE.BoxGeometry(0.98, 0.075, 0.15);
			const railHeadGeo = new THREE.BoxGeometry(0.065, 0.045, 0.16);
			const railWebGeo = new THREE.BoxGeometry(0.022, 0.065, 0.16);
			const railFootGeo = new THREE.BoxGeometry(0.095, 0.022, 0.16);

			function buildTrack(c) {
				ribbon(c, 1.23, -0.115, mats.ballast);
				const count = Math.floor(c.getLength() / 0.29);
				const sleepers = new THREE.InstancedMesh(
					sleeperGeo,
					mats.sleeper,
					count + 1,
				);
				sleepers.castShadow = true;
				sleepers.receiveShadow = true;
				scene.add(sleepers);
				const dummy = new THREE.Object3D();
				for (let i = 0; i <= count; i++) {
					const t = i / count;
					dummy.position.copy(c.getPointAt(t));
					dummy.position.y -= 0.075;
					dummy.quaternion.setFromUnitVectors(Z, c.getTangentAt(t));
					dummy.scale.set(1, 1, 1);
					dummy.updateMatrix();
					sleepers.setMatrixAt(i, dummy.matrix);
				}

				const steps = Math.ceil(c.getLength() / 0.15);
				const heads = new THREE.InstancedMesh(
					railHeadGeo,
					mats.steel,
					steps * 2,
				);
				const webs = new THREE.InstancedMesh(
					railWebGeo,
					mats.darkSteel,
					steps * 2,
				);
				const feet = new THREE.InstancedMesh(
					railFootGeo,
					mats.darkSteel,
					steps * 2,
				);
				for (const m of [heads, webs, feet]) {
					m.castShadow = true;
					m.receiveShadow = true;
					scene.add(m);
				}
				let k = 0;
				for (let i = 0; i < steps; i++) {
					const t0 = i / steps,
						t1 = (i + 1) / steps;
					for (const sign of [-1, 1]) {
						const p = c
							.getPointAt(t0)
							.addScaledVector(side(c, t0), sign * 0.3);
						const q = c
							.getPointAt(t1)
							.addScaledVector(side(c, t1), sign * 0.3);
						const center = p.clone().add(q).multiplyScalar(0.5);
						dummy.quaternion.setFromUnitVectors(
							Z,
							q.clone().sub(p).normalize(),
						);
						dummy.scale.set(1, 1, (p.distanceTo(q) / 0.16) * 1.018);
						for (const [m, y] of [
							[heads, 0],
							[webs, -0.043],
							[feet, -0.085],
						]) {
							dummy.position.copy(center);
							dummy.position.y += y;
							dummy.updateMatrix();
							m.setMatrixAt(k, dummy.matrix);
						}
						k++;
					}
				}
			}
			paths.forEach(buildTrack);

			// Embankment supports the elevated track without hiding its rails.
			ribbon(B[0], 1.85, -0.14, mats.grass);
			for (let i = 0; i < 250; i++) {
				const p = B[0].getPointAt(i / 249);
				if (p.y > 0.23) {
					const bank = ball(0.57, mats.grass, p.x, p.y - 0.49, p.z);
					bank.scale.set(1.3, 0.75, 1.3);
				}
			}

			// Hill around an actual open tunnel.
			// Its top and outside slopes leave the bore unobstructed.
			const tunnelStart = -6.9,
				tunnelEnd = -0.9,
				tunnelZ = -10;
			const tunnelRadius = 0.94,
				tunnelCenter = 0.9;

			function tunnelPortal(x) {
				const shape = new THREE.Shape();
				const outer = 1.3,
					inner = tunnelRadius,
					cy = tunnelCenter;
				shape.moveTo(-outer, 0);
				shape.lineTo(-outer, cy);
				shape.absarc(0, cy, outer, Math.PI, 0, true);
				shape.lineTo(outer, 0);
				shape.lineTo(inner, 0);
				shape.lineTo(inner, cy);
				shape.absarc(0, cy, inner, 0, Math.PI, false);
				shape.lineTo(-inner, 0);
				shape.closePath();

				const portal = addMesh(
					new THREE.ExtrudeGeometry(shape, {
						depth: 0.3,
						bevelEnabled: false,
					}),
					mats.stone,
				);
				portal.rotation.y = Math.PI / 2;
				portal.position.set(x, 0.06, tunnelZ);
				for (const z of [-1.44, 1.44]) {
					box(
						0.45,
						1.85,
						0.35,
						mats.stone,
						x + 0.12,
						0.98,
						tunnelZ + z,
					);
				}
				const joints = material(0x5d6058);
				for (let i = 0; i <= 13; i++) {
					const a = (i / 13) * Math.PI;
					const b = box(
						0.022,
						0.23,
						0.025,
						joints,
						x - 0.014,
						cy + 0.06 + Math.sin(a) * 1.12,
						tunnelZ + Math.cos(a) * 1.12,
					);
					b.rotation.x = a - Math.PI / 2;
				}
			}
			tunnelPortal(tunnelStart);
			tunnelPortal(tunnelEnd);

			const boreVertices = [],
				boreIndices = [];
			for (let i = 0; i <= 40; i++) {
				const a = (i / 40) * Math.PI;
				for (const x of [tunnelStart + 0.05, tunnelEnd + 0.25]) {
					boreVertices.push(
						x,
						0.06 + tunnelCenter + Math.sin(a) * tunnelRadius,
						tunnelZ + Math.cos(a) * tunnelRadius,
					);
				}
				if (i < 40) {
					const k = i * 2;
					boreIndices.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
				}
			}
			const boreGeo = new THREE.BufferGeometry();
			boreGeo.setAttribute(
				"position",
				new THREE.Float32BufferAttribute(boreVertices, 3),
			);
			boreGeo.setIndex(boreIndices);
			boreGeo.computeVertexNormals();
			const boreMat = material(0x494c43);
			boreMat.side = THREE.DoubleSide;
			addMesh(boreGeo, boreMat);
			for (const sign of [-1, 1])
				box(6.1, 0.9, 0.12, boreMat, -3.8, 0.5, tunnelZ + sign * 0.97);

			const hillGeo = new THREE.PlaneGeometry(6.1, 5.5, 40, 40);
			hillGeo.rotateX(-Math.PI / 2);
			const hp = hillGeo.attributes.position;
			for (let i = 0; i < hp.count; i++) {
				const x = hp.getX(i),
					z = hp.getZ(i),
					az = Math.abs(z);
				// Broad grassy roof with slopes falling outside the tunnel walls.
				let y =
					az < 1.28
						? 2.15 + 0.3 * Math.cos(x * 0.5)
						: Math.max(
								0.06,
								(2.15 + 0.3 * Math.cos(x * 0.5)) *
									(1 - (az - 1.28) / 1.47),
							);
				hp.setY(i, y);
			}
			hillGeo.computeVertexNormals();
			const hill = addMesh(hillGeo, mats.grass);
			hill.position.set(-3.85, 0, tunnelZ);

			// Water and natural bank.
			function pondShape(rx, rz) {
				const shape = new THREE.Shape();
				for (let i = 0; i <= 80; i++) {
					const a = (i / 80) * Math.PI * 2;
					const r =
						1 + 0.045 * Math.sin(a * 5) + 0.025 * Math.cos(a * 7);
					const x = Math.cos(a) * rx * r,
						y = Math.sin(a) * rz * r;
					if (i === 0) shape.moveTo(x, y);
					else shape.lineTo(x, y);
				}
				shape.closePath();
				return shape;
			}
			const shore = addMesh(
				new THREE.ShapeGeometry(pondShape(5.6, 2.95)),
				material(0x99916a),
			);
			shore.rotation.x = -Math.PI / 2;
			shore.position.set(0, 0.052, 0);
			const waterMat = new THREE.MeshPhysicalMaterial({
				color: 0x337d84,
				roughness: 0.2,
				metalness: 0.25,
				clearcoat: 1,
				transparent: true,
				opacity: 0.94,
			});
			const water = addMesh(
				new THREE.ShapeGeometry(pondShape(5.22, 2.6)),
				waterMat,
			);
			water.rotation.x = -Math.PI / 2;
			water.position.y = 0.069;
			water.castShadow = false;

			for (let i = 0; i < 90; i++) {
				const a = random() * Math.PI * 2,
					r = 1 + 0.045 * Math.sin(a * 5) + 0.025 * Math.cos(a * 7);
				const x = Math.cos(a) * 5.4 * r,
					z = Math.sin(a) * 2.8 * r;
				const rock = ball(
					0.11 + random() * 0.15,
					mats.stone,
					x,
					0.11,
					z,
				);
				rock.scale.set(1.35, 0.6, 1);
				if (i % 2 === 0) {
					for (let j = 0; j < 4; j++) {
						cylinder(
							0.012,
							0.018,
							0.35 + random() * 0.3,
							material(0x7d8252),
							x + (random() - 0.5) * 0.2,
							0.27,
							z + (random() - 0.5) * 0.2,
							scene,
							5,
						);
					}
				}
			}
			const ripples = [];
			for (let i = 0; i < 4; i++) {
				const r = addMesh(
					new THREE.RingGeometry(
						0.8 + i * 0.45,
						0.812 + i * 0.45,
						80,
					),
					new THREE.MeshBasicMaterial({
						color: 0xb3d8d5,
						transparent: true,
						opacity: 0.13,
						side: THREE.DoubleSide,
						depthWrite: false,
					}),
				);
				r.rotation.x = -Math.PI / 2;
				r.position.set(0.5, 0.078, 0);
				r.castShadow = false;
				ripples.push(r);
			}

			// Trees, with finer silhouettes than oversized polygon balls.
			function tree(x, z) {
				const g = new THREE.Group();
				g.position.set(x, 0.06, z);
				scene.add(g);
				const h = 1.4 + random() * 1.65;
				const leaf = mats.leaf[Math.floor(random() * 4)];
				cylinder(0.06, 0.12, h * 0.65, mats.wood, 0, h * 0.32, 0, g, 8);
				if (random() < 0.55) {
					for (let j = 0; j < 4; j++) {
						const cone = addMesh(
							new THREE.ConeGeometry(
								h * (0.24 - j * 0.035),
								h * 0.55,
								12,
							),
							leaf,
							g,
						);
						cone.position.y = h * (0.4 + j * 0.17);
					}
				} else {
					for (let j = 0; j < 9; j++) {
						const a = j * 2.4;
						const foliage = ball(
							h * 0.22,
							leaf,
							Math.cos(a) * h * 0.18,
							h * 0.66 + (j % 3) * h * 0.09,
							Math.sin(a) * h * 0.18,
							g,
							2,
						);
						foliage.scale.y = 1.2;
					}
				}
			}
			function bush(x, z) {
				const g = new THREE.Group();
				g.position.set(x, 0.06, z);
				scene.add(g);
				for (let j = 0; j < 3; j++) {
					const b = ball(
						0.18 + random() * 0.18,
						mats.leaf[Math.floor(random() * 4)],
						(random() - 0.5) * 0.3,
						0.2,
						(random() - 0.5) * 0.3,
						g,
						1,
					);
					b.scale.y = 0.75;
				}
			}
			for (let i = 0; i < 230; i++) {
				const x = (random() - 0.5) * 36.5,
					z = (random() - 0.5) * 25.5;
				if (nearTrack(x, z, 1.45)) continue;
				if ((x / 6) ** 2 + (z / 3.3) ** 2 < 1) continue;
				if (x > -7.4 && x < -0.4 && z < -7) continue;
				if (Math.abs(x) < 4 && z > 10.7) continue;
				(random() < 0.57 ? tree : bush)(x, z);
			}

			// Fence and station halt.
			function fence(c, offset) {
				let last;
				const n = Math.ceil(c.getLength() / 1.2);
				for (let i = 0; i <= n; i++) {
					const t = i / n,
						p = c.getPointAt(t).addScaledVector(side(c, t), offset);
					p.y = Math.max(0.06, p.y - 0.13);
					box(0.065, 0.63, 0.065, mats.wood, p.x, p.y + 0.315, p.z);
					if (last) {
						for (const y of [0.23, 0.48])
							beam(
								last.clone().add(V(0, y, 0)),
								p.clone().add(V(0, y, 0)),
								0.05,
								0.055,
								mats.wood,
							);
					}
					last = p;
				}
			}
			fence(B[0], 1.25);
			box(5, 0.34, 1.15, mats.stone, 1, 0.23, 11.5);
			box(1.7, 1.1, 0.85, mats.cream, 1, 0.96, 11.65);
			const roof = box(2.02, 0.13, 1.13, mats.wood, 1, 1.58, 11.65);
			for (const x of [0.45, 1.55])
				box(0.3, 0.35, 0.025, mats.glass, x, 1.06, 11.21);
			box(0.35, 0.74, 0.025, mats.wood, 1, 0.78, 11.21);
			for (const x of [-0.8, 2.8]) {
				cylinder(0.025, 0.025, 1.6, mats.darkSteel, x, 1.15, 11.75);
				ball(0.1, mats.cream, x, 1.99, 11.75);
			}

			// Route controls and trackside levers.
			const selected = [0, 0],
				leverParts = [],
				pickables = [];
			function makeLever(position, index) {
				const g = new THREE.Group();
				g.position.copy(position);
				g.position.z += 1.35;
				scene.add(g);
				box(0.55, 0.09, 0.4, mats.darkSteel, 0, -0.04, 0, g);
				const pivot = new THREE.Group();
				pivot.position.y = 0.02;
				g.add(pivot);
				cylinder(0.035, 0.035, 0.51, mats.steel, 0, 0.25, 0, pivot);
				const handle = ball(
					0.12,
					material(0xf0a93f, 0.4, 0.3),
					0,
					0.52,
					0,
					pivot,
					2,
				);
				handle.userData.index = index;
				pickables.push(handle);
				leverParts.push(pivot);
			}
			makeLever(A[0].getPointAt(0), 0);
			makeLever(B[0].getPointAt(0), 1);

			// Wheel convention:
			// axle = local X; train travel = local +Z;
			// each wheel group spins around X, while the tire stays aligned.
			const wheelRadius = 0.235;
			function wheel(parent, x, z, r = wheelRadius, spoked = true) {
				const spin = new THREE.Group();
				spin.position.set(x, r + 0.012, z);
				parent.add(spin);
				const tire = cylinder(
					r,
					r,
					0.072,
					mats.darkSteel,
					0,
					0,
					0,
					spin,
					32,
				);
				tire.rotation.z = Math.PI / 2;

				if (spoked) {
					// Open wheel interior, visible spokes and raised outer rim.
					tire.geometry.dispose();
					tire.geometry = new THREE.TorusGeometry(
						r - 0.028,
						0.028,
						8,
						32,
					);
					tire.rotation.set(0, Math.PI / 2, 0);

					const flange = addMesh(
						new THREE.TorusGeometry(r - 0.016, 0.016, 8, 32),
						mats.steel,
						spin,
					);
					flange.rotation.y = Math.PI / 2;
					flange.position.x = x > 0 ? -0.024 : 0.024;

					for (let i = 0; i < 10; i++) {
						const a = (i / 10) * Math.PI * 2;
						beam(
							V(0, 0, 0),
							V(
								0,
								Math.cos(a) * (r - 0.035),
								Math.sin(a) * (r - 0.035),
							),
							0.028,
							0.027,
							mats.green,
							spin,
						);
					}
				} else {
					const disk = cylinder(
						r * 0.78,
						r * 0.78,
						0.075,
						mats.black,
						0,
						0,
						0,
						spin,
						24,
					);
					disk.rotation.z = Math.PI / 2;
				}
				const hub = cylinder(
					0.052,
					0.052,
					0.093,
					mats.brass,
					0,
					0,
					0,
					spin,
					16,
				);
				hub.rotation.z = Math.PI / 2;
				return { spin, r };
			}
			function axle(parent, z, r = wheelRadius) {
				const a = cylinder(
					0.037,
					0.037,
					0.75,
					mats.darkSteel,
					0,
					r + 0.012,
					z,
					parent,
					12,
				);
				a.rotation.z = Math.PI / 2;
			}
			function boilerCylinder(parent, r, length, x, y, z, mat) {
				const m = cylinder(r, r, length, mat, x, y, z, parent, 32);
				m.rotation.x = Math.PI / 2;
				return m;
			}
			function buffers(g, length, width = 0.88) {
				for (const sign of [-1, 1]) {
					box(
						width,
						0.12,
						0.1,
						mats.red,
						0,
						0.4,
						(sign * length) / 2,
						g,
					);
					for (const x of [-0.3, 0.3]) {
						const b = cylinder(
							0.078,
							0.078,
							0.15,
							mats.black,
							x,
							0.4,
							sign * (length / 2 + 0.075),
							g,
						);
						b.rotation.x = Math.PI / 2;
					}
				}
			}
			function locomotive() {
				const g = new THREE.Group();
				scene.add(g);
				const wheels = [],
					rods = [];
				box(0.74, 0.13, 2.55, mats.black, 0, 0.38, 0, g);
				box(0.85, 0.055, 2.3, mats.green, 0, 0.47, 0, g);
				boilerCylinder(g, 0.31, 1.5, 0, 0.83, 0.3, mats.green);
				for (const z of [-0.3, 0.18, 0.65])
					boilerCylinder(g, 0.318, 0.025, 0, 0.83, z, mats.brass);
				boilerCylinder(g, 0.315, 0.17, 0, 0.83, 1.05, mats.black);
				cylinder(0.1, 0.13, 0.42, mats.black, 0, 1.18, 0.79, g);
				cylinder(0.145, 0.145, 0.06, mats.black, 0, 1.41, 0.79, g);
				ball(0.13, mats.brass, 0, 1.15, 0.1, g, 2);

				// Cab with open sides and framed windows.
				box(0.76, 0.26, 0.68, mats.green, 0, 0.66, -0.83, g);
				box(0.76, 0.67, 0.055, mats.green, 0, 0.91, -1.15, g);
				for (const x of [-0.38, 0.38]) {
					box(0.04, 0.67, 0.055, mats.green, x, 0.91, -0.52, g);
					box(0.035, 0.055, 0.62, mats.green, x, 1.23, -0.83, g);
					box(0.022, 0.29, 0.24, mats.glass, x, 1.04, -0.98, g);
				}
				box(0.91, 0.1, 0.85, mats.black, 0, 1.3, -0.83, g);
				for (const x of [-0.18, 0.18])
					box(0.24, 0.3, 0.012, mats.glass, x, 1.02, -1.185, g);

				const wheelZ = [-0.69, -0.1, 0.49];
				for (const z of wheelZ) {
					axle(g, z);
					for (const x of [-0.405, 0.405])
						wheels.push(wheel(g, x, z));
				}

				// Rods move on the crankpins in the YZ plane.
				for (const sign of [-1, 1]) {
					const rod = box(
						0.04,
						0.047,
						1.18,
						mats.steel,
						sign * 0.465,
						wheelRadius + 0.012,
						-0.1,
						g,
					);
					const pins = wheelZ.map((z) =>
						ball(
							0.043,
							mats.brass,
							sign * 0.49,
							wheelRadius + 0.012,
							z,
							g,
							1,
						),
					);
					rods.push({ rod, pins, sign });
				}
				for (const x of [-0.37, 0.37]) {
					const pipe = beam(
						V(x, 1.05, -0.35),
						V(x, 1.05, 0.91),
						0.018,
						0.018,
						mats.brass,
						g,
					);
				}
				buffers(g, 2.62);
				const lamp = ball(
					0.05,
					new THREE.MeshBasicMaterial({ color: 0xffe4aa }),
					0,
					1.04,
					1.17,
					g,
					2,
				);
				return { g, wheels, rods };
			}
			function tender() {
				const g = new THREE.Group();
				scene.add(g);
				box(0.76, 0.13, 1.52, mats.black, 0, 0.35, 0, g);
				box(0.78, 0.46, 1.3, mats.green, 0, 0.65, 0, g);
				box(0.62, 0.06, 1.1, mats.black, 0, 0.91, 0, g);
				for (let i = 0; i < 30; i++)
					ball(
						0.055 + random() * 0.025,
						mats.black,
						(random() - 0.5) * 0.56,
						0.95,
						(random() - 0.5) * 0.98,
						g,
					);
				const wheels = [];
				for (const z of [-0.44, 0.44]) {
					axle(g, z, 0.18);
					for (const x of [-0.4, 0.4])
						wheels.push(wheel(g, x, z, 0.18, false));
				}
				buffers(g, 1.55, 0.8);
				return { g, wheels };
			}
			function coach() {
				const g = new THREE.Group();
				scene.add(g);
				box(0.8, 0.13, 2.42, mats.black, 0, 0.37, 0, g);
				box(0.84, 0.67, 2.3, mats.cream, 0, 0.84, 0, g);
				box(0.86, 0.21, 2.32, mats.green, 0, 0.58, 0, g);
				box(0.94, 0.13, 2.46, mats.black, 0, 1.23, 0, g);
				for (const x of [-0.429, 0.429]) {
					for (let i = 0; i < 7; i++)
						box(
							0.015,
							0.32,
							0.22,
							mats.glass,
							x,
							0.97,
							-0.9 + i * 0.3,
							g,
						);
					box(0.02, 0.023, 2.24, mats.brass, x, 1.16, 0, g);
				}
				const wheels = [];
				for (const bogie of [-0.76, 0.76]) {
					box(0.72, 0.13, 0.52, mats.darkSteel, 0, 0.28, bogie, g);
					for (const dz of [-0.17, 0.17]) {
						axle(g, bogie + dz, 0.16);
						for (const x of [-0.405, 0.405])
							wheels.push(wheel(g, x, bogie + dz, 0.16, false));
					}
				}
				buffers(g, 2.45, 0.84);
				return { g, wheels };
			}
			const train = [locomotive(), tender(), coach(), coach()];
			const spacing = [0, 2.22, 4.4, 7.1];

			// Start far enough from the junction that the entire train is on track.
			let segment = 0,
				route = 0,
				current = A[0],
				localDistance = 11;
			let travelled = 11,
				speed = 45,
				velocity = 0,
				paused = false,
				follow = false;
			const history = [];
			function record(p, t, d) {
				history.push({ p: p.clone(), t: t.clone(), d });
				while (history.length > 2 && history[1].d < d - 12)
					history.shift();
			}
			for (let d = 0; d <= 11; d += 0.035) {
				const t = d / current.getLength();
				record(current.getPointAt(t), current.getTangentAt(t), d);
			}
			function historyAt(d) {
				for (let i = history.length - 1; i > 0; i--) {
					const a = history[i - 1],
						b = history[i];
					if (a.d <= d) {
						const f = THREE.MathUtils.clamp(
							(d - a.d) / (b.d - a.d || 1),
							0,
							1,
						);
						return {
							p: a.p.clone().lerp(b.p, f),
							t: a.t.clone().lerp(b.t, f).normalize(),
						};
					}
				}
				return history[0];
			}
			function status() {
				const name =
					segment === 0
						? route
							? "Pond side"
							: "Tunnel"
						: route
							? "Lake side"
							: "Woodland rise";
				document.getElementById("status").innerHTML =
					`${paused ? "Paused" : "Running"} · Current route: ${name}<br>` +
					`<span style="color:#dbb565">Switch settings apply at the next junction.</span>`;
			}
			function setSwitch(index, value) {
				selected[index] = value;
				for (let k = 0; k < 2; k++)
					document
						.getElementById(`${index ? "b" : "a"}${k}`)
						.classList.toggle("active", k === value);
				leverParts[index].rotation.z = value ? -0.48 : 0.48;
				status();
			}
			for (let i = 0; i < 2; i++)
				for (let j = 0; j < 2; j++)
					document.getElementById(`${i ? "b" : "a"}${j}`).onclick =
						() => setSwitch(i, j);
			document.getElementById("speed").oninput = (e) => {
				speed = Number(e.target.value);
				document.getElementById("speedText").textContent = speed + "%";
			};
			document.getElementById("pause").onclick = (e) => {
				paused = !paused;
				e.target.textContent = paused ? "Resume" : "Pause";
				status();
			};
			document.getElementById("view").onclick = (e) => {
				follow = !follow;
				controls.enabled = !follow;
				e.target.textContent = follow ? "Orbit view" : "Follow train";
				if (!follow) controls.target.copy(train[0].g.position);
			};
			const ray = new THREE.Raycaster(),
				pointer = new THREE.Vector2();
			let clickStart;
			renderer.domElement.addEventListener(
				"pointerdown",
				(e) => (clickStart = [e.clientX, e.clientY]),
			);
			renderer.domElement.addEventListener("pointerup", (e) => {
				if (
					!clickStart ||
					Math.hypot(
						e.clientX - clickStart[0],
						e.clientY - clickStart[1],
					) > 5
				)
					return;
				pointer.set(
					(e.clientX / innerWidth) * 2 - 1,
					1 - (e.clientY / innerHeight) * 2,
				);
				ray.setFromCamera(pointer, camera);
				const hit = ray.intersectObjects(pickables)[0];
				if (hit) {
					const i = hit.object.userData.index;
					setSwitch(i, 1 - selected[i]);
				}
			});

			// Steam particles reuse one geometry.
			const steamGeometry = new THREE.IcosahedronGeometry(0.11, 1);
			const puffs = [];
			let steamTimer = 0;
			function puff() {
				const mat = new THREE.MeshStandardMaterial({
					color: 0xf1f0e9,
					transparent: true,
					opacity: 0.35,
					depthWrite: false,
					roughness: 1,
				});
				const m = new THREE.Mesh(steamGeometry, mat);
				m.position.copy(train[0].g.localToWorld(V(0, 1.48, 0.79)));
				scene.add(m);
				puffs.push({ m, age: 0 });
			}
			function insideTunnel(p) {
				return (
					p.x > tunnelStart &&
					p.x < tunnelEnd + 0.3 &&
					Math.abs(p.z - tunnelZ) < 0.8
				);
			}
			function positionTrain() {
				train.forEach((part, i) => {
					const s = historyAt(travelled - spacing[i]);
					// Rail head top is centerline Y + .0225.
					part.g.position.copy(s.p).add(V(0, 0.0225, 0));
					part.g.quaternion.setFromUnitVectors(Z, s.t);
					for (const w of part.wheels)
						w.spin.rotation.x = travelled / w.r;
					if (part.rods) {
						const phase = travelled / wheelRadius;
						for (const { rod, pins, sign } of part.rods) {
							const a = phase + (sign < 0 ? Math.PI / 2 : 0);
							const y = wheelRadius + 0.012 + Math.cos(a) * 0.09;
							const dz = Math.sin(a) * 0.09;
							rod.position.y = y;
							rod.position.z = -0.1 + dz;
							pins.forEach((p, j) =>
								p.position.set(
									sign * 0.49,
									y,
									[-0.69, -0.1, 0.49][j] + dz,
								),
							);
						}
					}
				});
			}
			setSwitch(0, 0);
			setSwitch(1, 0);
			positionTrain();

			const clock = new THREE.Clock();
			function animate() {
				requestAnimationFrame(animate);
				const dt = Math.min(clock.getDelta(), 0.04);
				const target = paused ? 0 : speed * 0.032;
				velocity = THREE.MathUtils.damp(velocity, target, 2.5, dt);
				let remaining = velocity * dt;

				// Small simulation steps preserve exact route history for the carriages.
				while (remaining > 1e-6) {
					const step = Math.min(
						0.025,
						remaining,
						current.getLength() - localDistance,
					);
					if (step > 1e-7) {
						localDistance += step;
						travelled += step;
						remaining -= step;
						const t = Math.min(
							1,
							localDistance / current.getLength(),
						);
						record(
							current.getPointAt(t),
							current.getTangentAt(t),
							travelled,
						);
					}
					if (localDistance >= current.getLength() - 1e-7) {
						segment = 1 - segment;
						route = selected[segment];
						current = (segment === 0 ? A : B)[route];
						localDistance = 0;
						status();
					}
				}
				positionTrain();

				if (velocity > 0.1 && !insideTunnel(train[0].g.position)) {
					steamTimer += dt;
					if (steamTimer > 0.16) {
						steamTimer = 0;
						puff();
					}
				}
				for (let i = puffs.length - 1; i >= 0; i--) {
					const p = puffs[i];
					p.age += dt;
					p.m.position.y += dt * 0.5;
					p.m.position.x += dt * 0.16;
					p.m.scale.setScalar(1 + p.age * 1.8);
					p.m.material.opacity = 0.35 * Math.max(0, 1 - p.age / 2.7);
					if (p.age > 2.7) {
						scene.remove(p.m);
						p.m.material.dispose();
						puffs.splice(i, 1);
					}
				}
				const time = clock.elapsedTime;
				ripples.forEach((r, i) => {
					const f = (time * 0.13 + i * 0.24) % 1;
					r.scale.set(1 + f * 0.7, 0.52 * (1 + f * 0.7), 1);
					r.material.opacity = 0.12 * (1 - f);
				});
				waterMat.roughness = 0.19 + 0.018 * Math.sin(time);

				if (follow) {
					const p = train[0].g.position;
					const back = V(0, 0, -1).applyQuaternion(
						train[0].g.quaternion,
					);
					const desired = p
						.clone()
						.addScaledVector(back, 6.8)
						.add(V(3.2, 3.5, 0));
					camera.position.lerp(desired, 1 - Math.exp(-dt * 2.8));
					camera.lookAt(p.clone().add(V(0, 0.65, 0)));
				} else controls.update();

				renderer.render(scene, camera);
			}
			animate();
			addEventListener("resize", () => {
				camera.aspect = innerWidth / innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(innerWidth, innerHeight);
			});
		</script>
	</body>
</html>
