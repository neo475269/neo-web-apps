<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAWSON Convenience Store – Three.js Interior</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:12px;color:#fff;background:rgba(0,104,183,.85);padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;max-width:300px;user-select:none}
  #hud b{font-size:16px;letter-spacing:1px}
  #views{position:fixed;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
  #views button{background:#fff;color:#0068b7;border:2px solid #0068b7;border-radius:6px;padding:6px 10px;font-weight:bold;cursor:pointer;font-size:12px}
  #views button:hover{background:#0068b7;color:#fff}
  #chime{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .5s}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud"><b>LAWSON</b> いらっしゃいませ！<br>
WASD / 矢印キー: 移動 &nbsp; ドラッグ: 視点<br>
Q / E: 上下 &nbsp; Shift: 速歩き<br>
Click the hot showcase / register to interact</div>
<div id="views">
  <button data-v="0">Entrance 入口</button>
  <button data-v="1">Counter レジ</button>
  <button data-v="2">Drinks 飲料</button>
  <button data-v="3">Aisles 売場</button>
  <button data-v="4">Overview 全体</button>
</div>
<div id="chime"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8ef);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 100);

// Store dimensions (metres)
const W = 16, D = 12, H = 2.9;
const X0 = -W / 2, X1 = W / 2, Z0 = -D / 2, Z1 = D / 2;
const LAWSON_BLUE = 0x0068b7;

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const JP = '"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif';

function box(w, h, d, mat, x, y, z, parent = scene, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function plane(w, h, mat, x, y, z, ry = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });

// Materials
const M = {
  white: std(0xf4f5f3, { roughness: 0.8 }),
  wall: std(0xeef0ee, { roughness: 0.9 }),
  ceiling: std(0xf7f7f5, { roughness: 0.95 }),
  shelfMetal: std(0xe9ebec, { roughness: 0.4, metalness: 0.3 }),
  darkMetal: std(0x3a3d42, { roughness: 0.4, metalness: 0.6 }),
  chrome: std(0xd8dde2, { roughness: 0.15, metalness: 0.9 }),
  wood: null,
  blue: std(LAWSON_BLUE, { roughness: 0.5 }),
  black: std(0x15161a, { roughness: 0.5 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, metalness: 0, transmission: 0.95, transparent: true, opacity: 0.25, ior: 1.5, thickness: 0.01, side: THREE.DoubleSide }),
  vinyl: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.08, transparent: true, opacity: 0.12, side: THREE.DoubleSide, clearcoat: 1 }),
  lightTube: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.2 }),
  screen: new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x7fc4ff, emissiveIntensity: 0.6 }),
};

// Wood-grain texture for counter front (orange-brown laminate like the photo)
M.wood = new THREE.MeshStandardMaterial({ roughness: 0.55, map: canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#c7884a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    g.strokeStyle = `rgba(${120 + Math.random() * 40},${70 + Math.random() * 30},30,${Math.random() * 0.25})`;
    g.lineWidth = rand(1, 4); g.beginPath();
    const x = Math.random() * w; g.moveTo(x, 0);
    g.bezierCurveTo(x + rand(-20, 20), h * 0.3, x + rand(-20, 20), h * 0.6, x + rand(-10, 10), h); g.stroke();
  }
}) });

// ---------- floor (glossy beige tiles with blue guide dots) ----------
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e9e5dc'; g.fillRect(0, 0, w, h);
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 228 + Math.random() * 10;
    g.fillStyle = `rgb(${v},${v - 3},${v - 10})`; g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    for (let k = 0; k < 40; k++) { g.fillStyle = `rgba(150,140,120,${Math.random() * 0.15})`; g.fillRect(i * s + Math.random() * s, j * s + Math.random() * s, 2, 2); }
  }
  g.strokeStyle = '#cfc9bd'; g.lineWidth = 3;
  for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(W / 2.4, D / 2.4);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshPhysicalMaterial({ map: floorTex, roughness: 0.18, clearcoat: 0.6, clearcoatRoughness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// Queue markers (blue social-distance footprints on floor, as in photo)
const markTex = canvasTex(256, 256, (g) => {
  g.fillStyle = '#1d77c9'; g.beginPath(); g.arc(128, 128, 120, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = `bold 46px ${JP}`; g.textAlign = 'center';
  g.fillText('お並び', 128, 115); g.fillText('ください', 128, 170);
});
for (let i = 0; i < 4; i++) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.22, 32), new THREE.MeshStandardMaterial({ map: markTex, roughness: 0.3, transparent: true }));
  m.rotation.x = -Math.PI / 2; m.position.set(3.2 + i * 0.0, 0.002, -0.6 + i * 1.0); scene.add(m);
}

// ---------- walls & ceiling ----------
box(W, H, 0.1, M.wall, 0, H / 2, Z0 - 0.05, scene, false);         // back
box(0.1, H, D, M.wall, X1 + 0.05, H / 2, 0, scene, false);          // right
box(0.1, H, D, M.wall, X0 - 0.05, H / 2, 0, scene, false);          // left
// front = glass windows w/ blue band, leaving an opening for the automatic door
const DOOR_X = 4.475, DOOR_W = 1.9;
const OPEN_L = DOOR_X - DOOR_W / 2, OPEN_R = DOOR_X + DOOR_W / 2;
box(W, 0.5, 0.12, M.blue, 0, H - 0.25, Z1 + 0.05, scene, false);
for (const [a, b] of [[X0, OPEN_L], [OPEN_R, X1]]) {          // window panes left & right of the doorway
  const w = b - a, cx = (a + b) / 2;
  box(w, 0.35, 0.1, M.wall, cx, 0.175, Z1 + 0.05, scene, false);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w, H - 0.85), M.glass);
  g.position.set(cx, 0.35 + (H - 0.85) / 2, Z1 + 0.04); g.rotation.y = Math.PI; scene.add(g);
}
for (let x = X0; x <= X1; x += 2)                               // window posts, skipping the doorway
  if (x < OPEN_L - 0.05 || x > OPEN_R + 0.05)
    box(0.06, H - 0.85, 0.08, M.darkMetal, x, 0.35 + (H - 0.85) / 2, Z1 + 0.05, scene, false);
// fixed door posts on each side of the doorway
box(0.08, H - 0.5, 0.12, M.darkMetal, OPEN_L, (H - 0.5) / 2, Z1, scene, false);
box(0.08, H - 0.5, 0.12, M.darkMetal, OPEN_R, (H - 0.5) / 2, Z1, scene, false);
// outside street backdrop
const streetTex = canvasTex(1024, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#9fb6c8'); gr.addColorStop(1, '#5e6a72');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 18; i++) { g.fillStyle = `hsl(210,10%,${30 + Math.random() * 30}%)`; const bw = rand(40, 110), bh = rand(60, 200); g.fillRect(i * 60, h - bh, bw, bh);
    g.fillStyle = 'rgba(255,240,180,.5)'; for (let k = 0; k < 10; k++) g.fillRect(i * 60 + rand(5, bw - 10), h - rand(10, bh), 6, 8); }
  g.fillStyle = '#444'; g.fillRect(0, h - 40, w, 40);
});
plane(W * 1.6, 6, new THREE.MeshBasicMaterial({ map: streetTex }), 0, 2.2, Z1 + 6, Math.PI);

// Ceiling
box(W, 0.05, D, M.ceiling, 0, H + 0.025, 0, scene, false);
// fluorescent light strips + vents
const tubeGeo = new THREE.BoxGeometry(2.4, 0.04, 0.14);
for (let x = -6; x <= 6; x += 3) for (let z = -4.5; z <= 4.5; z += 1.8) {
  const t = new THREE.Mesh(tubeGeo, M.lightTube); t.position.set(x, H - 0.02, z); scene.add(t);
}
for (const [x, z] of [[-3, 0], [2.5, -3], [5, 2]]) box(0.6, 0.02, 0.6, std(0xdedede), x, H - 0.01, z, scene, false);
// Security camera
const cam = new THREE.Group(); box(0.08, 0.15, 0.08, M.white, 0, -0.07, 0, cam); box(0.1, 0.08, 0.2, M.white, 0, -0.17, 0.05, cam);
cam.position.set(X1 - 0.3, H, Z0 + 0.8); scene.add(cam);

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 0.9));
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(3, 8, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 25 });
sun.shadow.bias = -0.0005; scene.add(sun);
for (const [x, z] of [[-4, -2], [2, -2], [-4, 3], [4, 3]]) {
  const p = new THREE.PointLight(0xfff8ee, 6, 9, 1.6); p.position.set(x, H - 0.3, z); scene.add(p);
}

// ---------- Product instancing ----------
const productColors = [0xe63946, 0xf1a208, 0x2a9d8f, 0x264653, 0xffffff, 0x8ecae6, 0xffb703, 0xfb8500, 0x6a994e, 0xd62828, 0x3a86ff, 0xff006e, 0xf4f1de, 0x9b5de5, 0x00bbf9, 0xfee440, 0x111111, 0xc0392b];
const boxItems = [], bottleItems = [], canItems = [];
const dummy = new THREE.Object3D();
function pushItem(list, x, y, z, sx, sy, sz, color, ry = 0) { list.push({ x, y, z, sx, sy, sz, color, ry }); }

// Fill a shelf board (in world space) along an axis with products.
// axis 'x' => shelf runs along X, facing +Z or -Z; axis 'z' => runs along Z facing ±X
function fillShelf(cx, y, cz, length, depth, axis, type = 'mixed', maxH = 0.3) {
  let s = -length / 2 + 0.03;
  while (s < length / 2 - 0.05) {
    const t = type === 'mixed' ? pick(['box', 'box', 'bottle', 'can']) : type;
    const color = pick(productColors);
    let w, h;
    if (t === 'box') { w = rand(0.08, 0.2); h = rand(0.1, Math.min(maxH, 0.3)); }
    else if (t === 'bottle') { w = 0.075; h = Math.min(maxH, rand(0.2, 0.26)); }
    else { w = 0.066; h = Math.min(maxH, 0.12); }
    if (s + w > length / 2) break;
    const facingN = Math.max(1, Math.floor(depth / (w * 1.05)));
    const pos = s + w / 2;
    for (let k = 0; k < facingN; k++) {
      const dd = -depth / 2 + w * 1.05 * (k + 0.5);
      const x = axis === 'x' ? cx + pos : cx + dd;
      const z = axis === 'x' ? cz + dd : cz + pos;
      if (t === 'box') pushItem(boxItems, x, y + h / 2, z, w, h, Math.min(depth / facingN, 0.12), color);
      else if (t === 'bottle') pushItem(bottleItems, x, y, z, 1, h / 0.24, 1, color);
      else pushItem(canItems, x, y, z, 1, 1, 1, color);
    }
    s += w + 0.008;
  }
}

// Gondola (double-sided shelf) running along Z
function gondola(x, z, len, levels = 5, height = 1.5) {
  const depth = 0.9, g = new THREE.Group();
  box(depth * 0.08, height, len, M.shelfMetal, x, height / 2, z);                   // centre back panel
  box(depth, 0.12, len, M.shelfMetal, x, 0.06, z);                                   // kick plate
  box(depth, 0.03, 0.03, M.shelfMetal, x, height, z - len / 2);
  for (const e of [-1, 1]) {                                                          // end caps
    box(depth, height, 0.03, M.shelfMetal, x, height / 2, z + e * len / 2);
  }
  // end-cap promotional sign
  for (const e of [-1, 1]) {
    const tex = canvasTex(512, 256, (g2, w, h) => {
      g2.fillStyle = pick(['#e60012', '#0068b7', '#f39800']); g2.fillRect(0, 0, w, h);
      g2.fillStyle = '#fff'; g2.font = `bold 80px ${JP}`; g2.textAlign = 'center';
      g2.fillText(pick(['新発売!', 'おすすめ', '期間限定', 'お買い得']), w / 2, 120);
      g2.font = `bold 50px ${JP}`; g2.fillText(pick(['¥98', '¥128', '2個で¥200', '¥158']), w / 2, 205);
    });
    const p = plane(0.8, 0.4, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }), x, height + 0.25, z + e * (len / 2 + 0.02), e > 0 ? 0 : Math.PI);
    box(0.02, 0.3, 0.02, M.chrome, x, height + 0.03, z + e * len / 2);
  }
  for (let i = 0; i < levels; i++) {
    const y = 0.13 + i * (height - 0.2) / levels;
    for (const side of [-1, 1]) {
      const sx = x + side * depth / 4;
      box(depth / 2 - 0.04, 0.02, len - 0.04, M.shelfMetal, sx, y, z, scene, false);
      // price rail
      box(0.01, 0.035, len - 0.04, std(0xffffff), x + side * (depth / 2 - 0.02), y - 0.005, z, scene, false);
      fillShelf(sx, y + 0.01, z, len - 0.06, depth / 2 - 0.08, 'z', 'mixed', (height - 0.2) / levels - 0.05);
    }
  }
}
gondola(-5.6, 1.2, 5.0);
gondola(-3.6, 1.2, 5.0);
gondola(-1.6, 1.2, 5.0);

// Wall shelving along left wall (snacks / daily goods)
function wallShelf(x, z, len, levels, height, axis, facing) {
  const depth = 0.45;
  for (let i = 0; i < levels; i++) {
    const y = 0.15 + i * (height - 0.2) / levels;
    if (axis === 'z') {
      box(depth, 0.02, len, M.shelfMetal, x, y, z, scene, false);
      fillShelf(x, y + 0.01, z, len - 0.05, depth - 0.1, 'z', 'box', (height - 0.2) / levels - 0.05);
    } else {
      box(len, 0.02, depth, M.shelfMetal, x, y, z, scene, false);
      fillShelf(x, y + 0.01, z, len - 0.05, depth - 0.1, 'x', 'box', (height - 0.2) / levels - 0.05);
    }
  }
  if (axis === 'z') box(0.04, height, len, M.shelfMetal, x - facing * depth / 2, height / 2, z);
  else box(len, height, 0.04, M.shelfMetal, x, height / 2, z - facing * depth / 2);
}
wallShelf(X0 + 0.25, 1.2, 6.5, 6, 1.9, 'z', 1);

// ---------- Walk-in drink coolers along back wall ----------
function cooler(x0, x1) {
  const z = Z0 + 0.45, h = 2.1, doorW = 0.7;
  const n = Math.round((x1 - x0) / doorW);
  box(x1 - x0, h + 0.1, 0.9, M.black, (x0 + x1) / 2, (h + 0.1) / 2, z - 0.05);
  // header sign
  const headTex = canvasTex(1024, 96, (g, w, hh) => {
    g.fillStyle = '#0068b7'; g.fillRect(0, 0, w, hh);
    g.fillStyle = '#fff'; g.font = `bold 54px ${JP}`; g.textAlign = 'center';
    g.fillText('お茶 ・ 水 ・ 炭酸 ・ コーヒー ・ ビール  COLD DRINKS', w / 2, 66);
  });
  plane(x1 - x0, 0.32, new THREE.MeshStandardMaterial({ map: headTex, emissive: 0xffffff, emissiveMap: headTex, emissiveIntensity: 0.4 }), (x0 + x1) / 2, h + 0.3, z + 0.41);
  for (let i = 0; i < n; i++) {
    const cx = x0 + doorW * (i + 0.5);
    // interior light
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.03, h - 0.15, 0.03), M.lightTube); l.position.set(cx - doorW / 2 + 0.03, h / 2, z + 0.3); scene.add(l);
    for (let k = 0; k < 6; k++) {
      const y = 0.12 + k * 0.33;
      box(doorW - 0.04, 0.015, 0.7, M.chrome, cx, y, z, scene, false);
      fillShelf(cx, y + 0.01, z, doorW - 0.08, 0.6, 'x', k < 2 ? 'bottle' : pick(['bottle', 'can', 'bottle']), 0.28);
    }
    // glass door + frame
    const door = new THREE.Mesh(new THREE.PlaneGeometry(doorW - 0.04, h - 0.1), M.glass); door.position.set(cx, h / 2, z + 0.42); scene.add(door);
    box(0.035, h, 0.04, M.darkMetal, cx - doorW / 2, h / 2, z + 0.42, scene, false);
    box(0.02, 0.6, 0.03, M.chrome, cx + doorW / 2 - 0.08, 1.1, z + 0.46, scene, false);
  }
  box(0.035, h, 0.04, M.darkMetal, x1, h / 2, z + 0.42, scene, false);
  box(x1 - x0, 0.06, 0.05, M.darkMetal, (x0 + x1) / 2, h, z + 0.42, scene, false);
  const cl = new THREE.RectAreaLight ? null : null;
  const pl = new THREE.PointLight(0xe8f4ff, 3, 4, 2); pl.position.set((x0 + x1) / 2, 1.2, z + 0.1); scene.add(pl);
}
cooler(X0 + 0.1, X0 + 0.1 + 0.7 * 10);

// Open chilled case (onigiri, bento, sandwiches) along left of back – multi-deck
function openCase(x, z, len) {
  const g = new THREE.Group();
  box(len, 0.6, 0.9, M.white, x, 0.3, z);
  box(len, 0.15, 0.95, M.blue, x, 0.55, z + 0.01);
  box(len, 1.6, 0.15, M.white, x, 1.3, z - 0.38);
  box(len, 0.15, 0.6, M.white, x, 2.0, z - 0.2);
  const signTex = canvasTex(1024, 128, (gg, w, h) => { gg.fillStyle = '#fff'; gg.fillRect(0, 0, w, h); gg.fillStyle = '#0068b7'; gg.font = `bold 70px ${JP}`; gg.textAlign = 'center'; gg.fillText('おにぎり・お弁当・サンドイッチ', w / 2, 90); });
  plane(len, 0.14, new THREE.MeshStandardMaterial({ map: signTex }), x, 2.0, z + 0.105);
  for (let k = 0; k < 4; k++) {
    const y = 0.65 + k * 0.32, dep = 0.35 + (3 - k) * 0.08;
    box(len - 0.04, 0.015, dep, M.chrome, x, y, z - 0.3 + dep / 2, scene, false);
    fillShelf(x, y + 0.01, z - 0.3 + dep / 2, len - 0.1, dep - 0.05, 'x', 'box', k === 0 ? 0.07 : 0.12);
  }
  const l = new THREE.Mesh(new THREE.BoxGeometry(len - 0.1, 0.02, 0.05), M.lightTube); l.position.set(x, 1.9, z - 0.1); scene.add(l);
}
openCase(-6.0, -2.5 + 0.0 - 0.6, 2.4);

// Magazine rack along front window
function magazineRack() {
  const x = -4.0, z = Z1 - 0.35, len = 6.5;
  box(len, 0.75, 0.5, M.shelfMetal, x, 0.375, z);
  for (let i = 0; i < 2; i++) box(len, 0.02, 0.3, M.shelfMetal, x, 0.95 + i * 0.3, z + 0.05);
  for (let i = 0; i < 3; i++) {
    let s = -len / 2 + 0.05;
    const y = i === 0 ? 0.76 : 0.96 + (i - 1) * 0.3;
    while (s < len / 2 - 0.25) {
      const w = rand(0.18, 0.24), c = new THREE.Color().setHSL(Math.random(), rand(0.4, 0.9), rand(0.35, 0.65));
      const mag = new THREE.Mesh(new THREE.BoxGeometry(w, 0.28, 0.01), std(c));

const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
const chime = document.getElementById('chime');
let chimeTimer;
function toast(msg) { chime.textContent = msg; chime.style.opacity = 1; clearTimeout(chimeTimer); chimeTimer = setTimeout(() => chime.style.opacity = 0, 2200); }
let audioCtx;
function playChime() {
  // Lawson-ish door chime (simple ascending tones)
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const notes = [659.25, 523.25, 587.33, 392.0, 392.0, 587.33, 659.25, 523.25];
  notes.forEach((f, i) => {
    const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = f; o.connect(gn); gn.connect(audioCtx.destination);
    const t = audioCtx.currentTime + i * 0.28; gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(0.15, t + 0.02); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.start(t); o.stop(t + 0.55);
  });
}
function beep() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator(), gn = audioCtx.createGain(); o.frequency.value = 1800; o.type = 'square';
  o.connect(gn); gn.connect(audioCtx.destination); gn.gain.value = 0.05; o.start(); o.stop(audioCtx.currentTime + 0.09);
}

let yaw = 0, pitch = 0, dragging = false, moved = 0, lx = 0, ly = 0;

  if (dragging && moved < 5) {

    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(scene.children, true)[0];

    } else if (tag?.userData.name === 'showcase') { toast('いらっしゃいませ！からあげクン、揚げたてです 🍗'); }
    else if (tag?.userData.name === 'door') { playChime(); toast('♪ ピロリロリン — いらっしゃいませ、ローソンへようこそ'); }

const blockers = [
  [-6.05, -5.15, -1.3, 3.7], [-4.05, -3.15, -1.3, 3.7], [-2.05, -1.15, -1.3, 3.7], // gondolas

function collide(x, z) {
  if (x < X0 + 0.25 || x > X1 - 0.25 || z < Z0 + 0.25 || z > Z1 - 0.25) return true;
  return blockers.some(([a, b, c, d]) => x > a - 0.2 && x < b + 0.2 && z > c - 0.2 && z < d + 0.2);

// ---------- animation ----------
const clock = new THREE.Clock();
let doorOpen = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (tween) {
    tween.t = Math.min(1, tween.t + dt * 0.8); const k = tween.t * tween.t * (3 - 2 * tween.t);
    camera.position.lerpVectors(tween.from, tween.to, k); yaw = tween.y0 + (tween.y1 - tween.y0) * k; pitch = tween.p0 + (tween.p1 - tween.p0) * k;
    if (tween.t >= 1) tween = null;
  } else {
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.2 : 1.6) * dt;
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const dx = (-Math.sin(yaw) * f + Math.cos(yaw) * s) * speed, dz = (-Math.cos(yaw) * f - Math.sin(yaw) * s) * speed;
    const p = camera.position;
    if (!collide(p.x + dx, p.z)) p.x += dx;
    if (!collide(p.x, p.z + dz)) p.z += dz;
    if (keys.KeyQ) p.y = Math.min(2.7, p.y + speed); if (keys.KeyE) p.y = Math.max(0.6, p.y - speed);
  }
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

    const pos = c.geometry.attributes.position, base = c.userData.base;
    for (let i = 0; i < pos.count; i++) {
      const bx = base[i * 3], by = base[i * 3 + 1];
      const amp = (0.525 - by) * 0.05;
      pos.array[i * 3 + 2] = Math.sin(t * 1.3 + bx * 3 + ci) * amp;
    }
    pos.needsUpdate = true;
  });
  hanging.forEach(h => h.rotation.z = Math.sin(t * 0.8 + h.userData.sway) * 0.015);

  // automatic doors open when camera near
  const near = camera.position.distanceTo(new THREE.Vector3(4.475, 1.6, Z1)) < 2.0 || walker.position.distanceTo(new THREE.Vector3(4.475, 0, Z1)) < 1.5;
  doorOpen += ((near ? 1 : 0) - doorOpen) * Math.min(1, dt * 4);
  doorL.position.x = 4.0 - doorOpen * 0.9; doorR.position.x = 4.95 + doorOpen * 0.9;

  // people idle motion
  people.forEach(pp => { pp.children.forEach(() => {}); pp.position.y = Math.sin(t * 2 + pp.userData.bob) * 0.004; });
  // a shopper strolls up and down an aisle
  const wz = 1.2 + Math.sin(t * 0.25) * 2.3;
  walker.position.z = wz; walker.position.x = -2.6;
  walker.rotation.y = Math.cos(t * 0.25) > 0 ? Math.PI : 0;
  walker.position.y = Math.abs(Math.sin(t * 4)) * 0.02;
  customer1.rotation.y = Math.PI + Math.sin(t * 0.5) * 0.08;

  renderer.render(scene, camera);
}
