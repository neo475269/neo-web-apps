<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#101512" />
		<meta
			name="description"
			content="A collection of five interactive browser worlds by Neo."
		/>
		<title>Neo Web Apps</title>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap");

			:root {
				color-scheme: dark;
				--ink: #f5f1e8;
				--muted: #aab3aa;
				--line: rgba(245, 241, 232, 0.14);
				--surface: #171d19;
				--accent: #d8ff59;
			}

			* {
				box-sizing: border-box;
			}

			html {
				background: #101512;
			}

			body {
				margin: 0;
				min-height: 100vh;
				color: var(--ink);
				font-family: "Manrope", sans-serif;
				background:
					linear-gradient(
						rgba(216, 255, 89, 0.035) 1px,
						transparent 1px
					),
					linear-gradient(
						90deg,
						rgba(216, 255, 89, 0.035) 1px,
						transparent 1px
					),
					#101512;
				background-size: 48px 48px;
			}

			main {
				width: min(1180px, calc(100% - 40px));
				margin: 0 auto;
				padding: 64px 0 80px;
			}

			header {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: end;
				gap: 32px;
				margin-bottom: 42px;
				animation: arrive 550ms ease-out both;
			}

			.eyebrow,
			.count,
			.card-number {
				font-family: "DM Mono", monospace;
				text-transform: uppercase;
				letter-spacing: 0;
			}

			.eyebrow {
				margin: 0 0 12px;
				color: var(--accent);
				font-size: 12px;
			}

			h1 {
				max-width: 780px;
				margin: 0;
				font-size: clamp(42px, 8vw, 92px);
				font-weight: 600;
				line-height: 0.94;
				letter-spacing: 0;
			}

			.count {
				margin: 0 0 7px;
				color: var(--muted);
				font-size: 12px;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(12, 1fr);
				gap: 18px;
			}

			.card {
				position: relative;
				grid-column: span 4;
				min-height: 360px;
				overflow: hidden;
				color: var(--ink);
				text-decoration: none;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 6px;
				isolation: isolate;
				animation: arrive 550ms ease-out both;
			}

			.card:nth-child(2) {
				animation-delay: 70ms;
			}
			.card:nth-child(3) {
				animation-delay: 140ms;
			}
			.card:nth-child(4) {
				animation-delay: 210ms;
			}
			.card:nth-child(5) {
				animation-delay: 280ms;
			}
			.card.wide {
				grid-column: span 6;
			}

			.visual {
				position: absolute;
				inset: 0 0 118px;
				overflow: hidden;
				transition: transform 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
			}

			.card:hover .visual,
			.card:focus-visible .visual {
				transform: scale(1.035);
			}

			.earth {
				background:
					radial-gradient(
						circle at 54% 54%,
						transparent 0 23%,
						rgba(70, 180, 220, 0.18) 24%,
						transparent 25%
					),
					radial-gradient(
						circle at 54% 54%,
						#68a67b 0 5%,
						#2479a0 16%,
						#092b49 28%,
						transparent 29%
					),
					radial-gradient(
						circle at 30% 20%,
						#315071,
						#090d18 55%,
						#030507
					);
			}

			.reef {
				background:
					radial-gradient(
						ellipse at 30% 80%,
						#ef7a5c 0 4%,
						transparent 5%
					),
					radial-gradient(
						ellipse at 70% 62%,
						#f3c64d 0 3%,
						transparent 4%
					),
					radial-gradient(
						ellipse at 46% 46%,
						#49b5cc 0 4%,
						transparent 5%
					),
					linear-gradient(160deg, #36bad4, #075481 60%, #05263b);
			}

			.cottage {
				background:
					linear-gradient(
							145deg,
							transparent 0 43%,
							#72512e 44% 58%,
							transparent 59%
						)
						center 35% / 72% 55% no-repeat,
					linear-gradient(
						#9fba73 0 58%,
						#60713a 59% 66%,
						#35401f 67%
					);
			}

			.city {
				background:
					linear-gradient(
						30deg,
						transparent 32%,
						rgba(255, 255, 255, 0.14) 33% 34%,
						transparent 35%
					),
					linear-gradient(
						150deg,
						transparent 32%,
						rgba(255, 255, 255, 0.1) 33% 34%,
						transparent 35%
					),
					linear-gradient(#7ea2b8 0 34%, #536d67 35%);
				background-size:
					46px 46px,
					46px 46px,
					auto;
			}

			.windmill {
				background:
					conic-gradient(
						from 8deg at 67% 46%,
						transparent 0 11%,
						rgba(74, 47, 28, 0.85) 12% 13%,
						transparent 14% 36%,
						rgba(74, 47, 28, 0.85) 37% 38%,
						transparent 39% 61%,
						rgba(74, 47, 28, 0.85) 62% 63%,
						transparent 64% 86%,
						rgba(74, 47, 28, 0.85) 87% 88%,
						transparent 89%
					),
					linear-gradient(165deg, #f4b66e, #e47759 58%, #7e7440 59%);
			}

			.card-copy {
				position: absolute;
				inset: auto 0 0;
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: end;
				gap: 20px;
				min-height: 118px;
				padding: 22px;
				background: rgba(15, 20, 17, 0.94);
				border-top: 1px solid var(--line);
			}

			.card-number {
				margin: 0 0 7px;
				color: var(--muted);
				font-size: 10px;
			}

			h2 {
				margin: 0;
				font-size: 21px;
				line-height: 1.15;
				letter-spacing: 0;
			}

			.open {
				display: grid;
				width: 40px;
				height: 40px;
				place-items: center;
				color: #101512;
				font-size: 22px;
				background: var(--accent);
				border-radius: 50%;
				transition: transform 200ms ease;
			}

			.card:hover .open,
			.card:focus-visible .open {
				transform: rotate(-45deg);
			}

			.card:focus-visible {
				outline: 3px solid var(--accent);
				outline-offset: 3px;
			}

			footer {
				display: flex;
				justify-content: space-between;
				gap: 20px;
				margin-top: 28px;
				color: var(--muted);
				font:
					12px "DM Mono",
					monospace;
			}

			@keyframes arrive {
				from {
					opacity: 0;
					transform: translateY(18px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@media (max-width: 820px) {
				main {
					padding-top: 42px;
				}
				header {
					grid-template-columns: 1fr;
					gap: 14px;
				}
				.card,
				.card.wide {
					grid-column: span 6;
				}
			}

			@media (max-width: 560px) {
				main {
					width: min(100% - 24px, 1180px);
					padding-top: 28px;
				}
				h1 {
					font-size: 46px;
				}
				.card,
				.card.wide {
					grid-column: 1 / -1;
					min-height: 330px;
				}
				footer {
					flex-direction: column;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<div>
					<p class="eyebrow">Interactive collection / 2026</p>
					<h1>Five worlds.<br />One browser.</h1>
				</div>
				<p class="count">05 experiments<br />WebGL + Canvas</p>
			</header>

			<section class="grid" aria-label="Web app collection">
				<a
					class="card wide"
					href="3D%20earth/3D%20earth%20gpt-6%20Y260907.html"
				>
					<div class="visual earth" aria-hidden="true"></div>
					<div class="card-copy">
						<div>
							<p class="card-number">01 / Orbital</p>
							<h2>Earth Explorer</h2>
						</div>
						<span class="open" aria-hidden="true">↗</span>
					</div>
				</a>

				<a class="card wide" href="coralfish/coralfish.html">
					<div class="visual reef" aria-hidden="true"></div>
					<div class="card-copy">
						<div>
							<p class="card-number">02 / Aquatic</p>
							<h2>Coral Reef Tank</h2>
						</div>
						<span class="open" aria-hidden="true">↗</span>
					</div>
				</a>

				<a class="card" href="farmhouse/farmhouse.html">
					<div class="visual cottage" aria-hidden="true"></div>
					<div class="card-copy">
						<div>
							<p class="card-number">03 / Pastoral</p>
							<h2>Thatched Cottage</h2>
						</div>
						<span class="open" aria-hidden="true">↗</span>
					</div>
				</a>

				<a class="card" href="simcity/simcity.html">
					<div class="visual city" aria-hidden="true"></div>
					<div class="card-copy">
						<div>
							<p class="card-number">04 / Urban</p>
							<h2>SimCity 2000</h2>
						</div>
						<span class="open" aria-hidden="true">↗</span>
					</div>
				</a>

				<a class="card" href="windmill/windwill.html">
					<div class="visual windmill" aria-hidden="true"></div>
					<div class="card-copy">
						<div>
							<p class="card-number">05 / Golden hour</p>
							<h2>Vineyard Windmill</h2>
						</div>
						<span class="open" aria-hidden="true">↗</span>
					</div>
				</a>
			</section>

			<footer>
				<span>NEO WEB APPS</span>
				<span>SELECT A WORLD TO ENTER</span>
			</footer>
		</main>
	</body>
</html>
